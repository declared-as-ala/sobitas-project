name: Deploy Fitness API (Docker Image)

# Single workflow for NestJS fitness backend: Docker image build + push to GHCR, then VPS restart.
on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "fitness-api/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-fitness-api.yml"
  workflow_dispatch:

# Serialise deploys. Two merges close together each build and push the SAME `:latest` tag, then
# each pulls `:latest` on the VPS — so the image that ends up running is whichever build finished
# last, not whichever commit is newest. That is not theoretical: PRs #183 and #184 merged 13s
# apart, their deploys finished 2s apart, and the box came up running the earlier commit's image.
# The category fix in #184 was reported green and was simply not on the server; Googlebot kept
# seeing 20 of 79 products until the run was re-triggered by hand.
#
# cancel-in-progress is deliberately FALSE. Cancelling a half-finished deploy could leave the VPS
# mid-recreate; queueing costs a few minutes and always converges on the newest commit.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: declared-as-ala/sobitas-fitness-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Dockerfile exists
        run: |
          set -e
          test -f fitness-api/Dockerfile || (echo "❌ fitness-api/Dockerfile not found" && exit 1)
          echo "✓ fitness-api/Dockerfile found"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./fitness-api
          file: ./fitness-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 900s
          script_stop: true
          script: |
            set -eo pipefail
            APP_DIR="/root/sobitas-project"
            cd "$APP_DIR"

            echo "📥 Fetching latest codebase changes on VPS..."
            git pull || git pull origin main || echo "⚠️ git pull warning"

            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u declared-as-ala --password-stdin

            echo "📦 Pull latest fitness-api image..."
            docker pull ghcr.io/declared-as-ala/sobitas-fitness-api:latest

            echo "🗄️  Pre-Prisma database backup (this DB is SHARED with the store — always back up first)..."
            docker compose up -d mysql >/dev/null 2>&1 || true
            mkdir -p /var/sobitas/backups
            BACKUP_FILE="/var/sobitas/backups/db-pre-prisma-$(date +%Y%m%d-%H%M%S).sql.gz"
            if docker exec sobitas-mysql sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --triggers --databases "$MYSQL_DATABASE"' 2>/dev/null | gzip > "$BACKUP_FILE"; then
              echo "✓ Backup written: $BACKUP_FILE ($(du -h "$BACKUP_FILE" 2>/dev/null | cut -f1))"
            else
              echo "❌ Pre-Prisma backup FAILED — refusing to run a schema sync against the shared DB without a backup."
              rm -f "$BACKUP_FILE" || true
              exit 1
            fi
            ls -1t /var/sobitas/backups/db-pre-prisma-*.sql.gz 2>/dev/null | tail -n +31 | xargs -r rm -f || true

            echo "🔄 Restart fitness-api..."
            docker compose up -d --force-recreate --no-deps fitness-api

            echo "🗄️ Syncing Prisma database schema (additive ONLY, never destructive)..."
            # This DB is SHARED with the Laravel e-commerce store (users, products, orders…).
            # Prisma must only ADD (e.g. new fitness_* tables). Without --accept-data-loss it
            # refuses and exits non-zero if it would DROP/ALTER a live column. We now FAIL THE
            # DEPLOY LOUDLY on that refusal (a human must reconcile the drift) instead of
            # swallowing it with `|| echo`, so no destructive schema change slips through
            # silently. NEVER add --accept-data-loss here.
            if ! docker compose exec -T fitness-api npx prisma db push; then
              echo "❌ Prisma db push FAILED or refused a DESTRUCTIVE change on the SHARED production DB."
              echo "   A backup was taken above. A human must review the schema drift and reconcile it."
              echo "   DO NOT add --accept-data-loss. Failing the deploy on purpose."
              exit 1
            fi

            echo "🧹 Cleaning unused images..."
            docker image prune -f || true

            echo "✅ Fitness API deploy done"
