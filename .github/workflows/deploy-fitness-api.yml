name: Deploy Fitness API (Docker Image)

# Single workflow for NestJS fitness backend: Docker image build + push to GHCR, then VPS restart.
on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "fitness-api/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-fitness-api.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: declared-as-ala/sobitas-fitness-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: |
          set -e
          test -f fitness-api/Dockerfile || (echo "❌ fitness-api/Dockerfile not found" && exit 1)
          echo "✓ fitness-api/Dockerfile found"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./fitness-api
          file: ./fitness-api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 900s
          script_stop: true
          script: |
            set -e
            APP_DIR="/root/sobitas-project"
            cd "$APP_DIR"

            echo "📥 Fetching latest codebase changes on VPS..."
            git pull || git pull origin main || echo "⚠️ git pull warning"

            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u declared-as-ala --password-stdin

            echo "📦 Pull latest fitness-api image..."
            docker pull ghcr.io/declared-as-ala/sobitas-fitness-api:latest

            echo "🔄 Restart fitness-api..."
            docker compose up -d --force-recreate --no-deps fitness-api

            echo "🗄️ Syncing Prisma database schema (additive only)..."
            # Deliberately NOT using --accept-data-loss: this database is shared with the Laravel
            # e-commerce app (users, products, etc.), which Prisma only introspects/reads for some
            # models. Without --accept-data-loss, Prisma applies safe/additive changes (e.g. new
            # fitness_* tables) but refuses and exits non-zero if it would drop/alter a column —
            # forcing a human to review and run it manually if a destructive change is ever intended.
            docker compose exec -T fitness-api npx prisma db push || echo "⚠️ Prisma db push needs manual review (see above) — not auto-applying destructive changes."

            echo "🧹 Cleaning unused images..."
            docker image prune -f || true

            echo "✅ Fitness API deploy done"
