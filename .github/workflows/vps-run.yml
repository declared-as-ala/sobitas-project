name: Run pipeline task on VPS

# One clickable button for the catalogue pipeline, for an owner who has no terminal.
#
# Actions -> "Run pipeline task on VPS" -> Run workflow -> pick a task -> green button.
# The job log is the output. That is the whole interaction.
#
# ---------------------------------------------------------------------------------------------
# WHY THE COMMAND IS RESOLVED ON THE RUNNER AND NOT ON THE VPS
# ---------------------------------------------------------------------------------------------
# The first version put a `case "$TASK" in ... esac` inside the remote script and forwarded TASK
# with appleboy's `envs:`. It failed four times in a row, always with the same message:
#
#     bash: -c: line 33: syntax error near unexpected token ';'
#
# and it stayed on line 33 across three different scripts - after the case arms were flattened
# (which moved every line, so line 33 became a COMMENT, and a comment cannot be a syntax error),
# after apostrophes were removed, and after the file was reduced to pure ASCII. An identical error
# at a fixed offset over different content means the remote bash was not receiving the script as
# written. deploy-filament.yml carries emoji, em-dashes and quotes in its script and deploys fine;
# the one thing it does NOT use is `envs:`.
#
# So the case statement now runs in an ordinary `run:` step on the GitHub runner, where bash is
# native and its behaviour is not in question, and the remote script is a short block with one
# interpolated value.
#
# ---------------------------------------------------------------------------------------------
# WHY INTERPOLATING THAT VALUE IS SAFE, WHEN INTERPOLATING THE INPUT WOULD NOT BE
# ---------------------------------------------------------------------------------------------
# `${{ }}` is substituted into the remote script as LITERAL TEXT before it is sent, so putting
# operator-typed text there is remote code execution through a web form. That is exactly why
# `inputs.task` and `inputs.confirm` NEVER appear inside `script:`.
#
# What is interpolated is `steps.resolve.outputs.args`, and every value it can hold is a string
# literal written in the case block below. The operator cannot reach it: the dropdown is
# `type: choice`, so GitHub rejects any dispatch whose value is not a listed option, and an
# unmatched token exits before the SSH step runs. The value crossing the boundary is ours.

run-name: "${{ inputs.task }} by ${{ github.actor }}"

on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        required: true
        default: catalog-status
        options:
          # read-only: safe to click at any time, any number of times
          - catalog-status
          - catalog-promote-dry-run
          - research-import-dry-run
          - seo-ctr-pass-dry-run
          - queue-log
          - scheduler-log
          # The three logs the scheduler redirects away from the container's stdout. Without
          # these, a pass that runs and decides to do nothing is indistinguishable from a pass
          # that is working.
          - content-status
          - content-log
          - promote-log
          - laravel-log
          # Robots/indexability. The dry run reports how many products are noindexed and how many
          # are nofollowed; it changes nothing.
          - seo-robots-audit
          # staging table only: no customer-visible effect
          - catalog-discover
          - catalog-hydrate-now
          - catalog-retry-failed
          - catalog-reset-stuck
          # WRITES: these need confirm=APPLY
          - research-import-apply
          - seo-ctr-pass
          - catalog-promote
          - catalog-publish-wave-500
          # Repairs `nofollow` on published products. Never touches the index flag.
          - seo-robots-fix
          # Re-measures products held at seo_robots_index=0 and indexes the ones whose body now
          # clears catalog.promotion.min_body_words. Creates and publishes nothing.
          - catalog-reindex
      confirm:
        description: "Writing tasks only (research-import-apply, catalog-promote, catalog-publish-wave-500, seo-robots-fix, catalog-reindex): type APPLY"
        required: false
        default: ""

# Serialise every run. Two artisan writes against the same tables at once is a problem nobody
# would enjoy diagnosing from a phone. cancel-in-progress is false for the same reason as in
# deploy-filament.yml: never kill a half-finished write.
concurrency:
  group: vps-artisan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: "${{ inputs.task }}"
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the task to a fixed artisan command
        id: resolve
        env:
          TASK: ${{ inputs.task }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          # MODE defaults to artisan; only the log tasks override it. SVC names the container a
          # filelog task reads from - storage/logs is NOT a shared volume, so the container is
          # part of the path.
          MODE=artisan
          SVC=backend-v2

          # A fixed token -> a fixed argv. Nothing the operator types reaches a shell.
          # WRITES=yes means "can touch the products table" and gates the backup below.
          case "$TASK" in
            catalog-status)
              ARGS="catalog:iherb:hydrate --status"
              WRITES=no
              ;;
            queue-log)
              # Not artisan - MODE=logs makes the remote script read container logs instead.
              # The queue worker's log is where a job exception actually lands; the staging row
              # only records what the job managed to write before it died, which for a crash
              # between claim and store is nothing at all.
              ARGS="backend-v2-queue"
              MODE=logs
              WRITES=no
              ;;
            scheduler-log)
              ARGS="backend-v2-scheduler"
              MODE=logs
              WRITES=no
              ;;
            content-status)
              # What the acquisition pass thinks it has left to do. Distinct from catalog-status,
              # which reports HYDRATION - the two stages have separate counters and the content
              # one is the stage that has been dead since 11/08.
              ARGS="catalog:iherb:content --status"
              WRITES=no
              ;;
            content-log)
              # The scheduler redirects this pass into its own file, so the container log shows
              # only "DONE in 2 s" and never the reason. This is that reason.
              #
              # SVC matters: only /var/www/html/storage/app/public is a bind mount, so
              # storage/logs is private to each container. The scheduler's redirect lands inside
              # the SCHEDULER, and reading the same path in backend-v2 reports "file does not
              # exist" — which is what happened on the first attempt at this and reads exactly
              # like "the pass never ran".
              ARGS="catalog-content.log"
              SVC=backend-v2-scheduler
              MODE=filelog
              WRITES=no
              ;;
            promote-log)
              ARGS="catalog-promote.log"
              SVC=backend-v2-scheduler
              MODE=filelog
              WRITES=no
              ;;
            laravel-log)
              # backend-v2 sets LOG_CHANNEL=stderr, so the web container's laravel.log is usually
              # empty and its output is in `docker compose logs backend-v2` instead. This is the
              # scheduler's copy, which is where an artisan pass's stack trace lands.
              ARGS="laravel.log"
              SVC=backend-v2-scheduler
              MODE=filelog
              WRITES=no
              ;;
            catalog-promote-dry-run)
              ARGS="catalog:iherb:promote --dry-run"
              WRITES=no
              ;;
            research-import-dry-run)
              ARGS="products:import-research storage/app/research.json"
              WRITES=no
              ;;
            seo-ctr-pass-dry-run)
              ARGS="seo:ctr-pass --dry-run"
              WRITES=no
              ;;
            seo-ctr-pass)
              # Rewrites meta_title/meta_description on six category pages that already rank on
              # page one and take almost no clicks - "omega 3 fish oil" alone is 3,331 impressions
              # at position 7.5 for zero visits. WRITES=no because it touches categs /
              # sous_categories only; the products table, which the backup gate exists to protect,
              # is not involved. The command is idempotent: a second run reports "already correct"
              # and writes nothing, so it can never silently revert a later edit made in Filament.
              ARGS="seo:ctr-pass"
              WRITES=no
              ;;
            catalog-discover)
              # Enumerate the catalogue from iHerb's sitemaps: 3 HTTP requests, ~47,537 rows into
              # external_catalog_products. Staging only - no product, page or URL is created.
              #
              # This task exists because the scheduler did not do it. The hourly bootstrap in
              # filament/routes/console.php was in place from 07:44, and at 11:08 the staging
              # table was still empty - so a schedule that looked self-starting had started
              # nothing, and there was no way to discover that except by asking the box. A manual
              # trigger is what turns "it should have run" into "it ran".
              ARGS="catalog:iherb:discover"
              WRITES=no
              ;;
            catalog-hydrate-now)
              # Dispatch a hydration window immediately rather than waiting for the ten-minute
              # schedule. Staging only.
              ARGS="catalog:iherb:hydrate --include-neutral --limit=500"
              WRITES=no
              ;;
            catalog-retry-failed)
              # A write, but to the staging table alone - no product, page or URL changes.
              ARGS="catalog:iherb:hydrate --retry-failed"
              WRITES=no
              ;;
            catalog-reset-stuck)
              # Reclaim rows a dead worker left in `hydrating`. Staging only. The 10-minute
              # threshold means a row a live worker is mid-fetch on is never handed to a second
              # worker.
              ARGS="catalog:iherb:hydrate --reset-stuck=10"
              WRITES=no
              ;;
            research-import-apply)
              ARGS="products:import-research storage/app/research.json --apply"
              WRITES=yes
              ;;
            catalog-promote)
              # Creates products UNPUBLISHED with seo_robots_index=0. Nothing becomes visible or
              # indexable until a publish wave is run deliberately.
              ARGS="catalog:iherb:promote"
              WRITES=yes
              ;;
            catalog-publish-wave-500)
              ARGS="catalog:iherb:promote --publish --limit=500"
              WRITES=yes
              ;;
            seo-robots-audit)
              ARGS="seo:products-robots-audit"
              WRITES=no
              ;;
            seo-robots-fix)
              # Sets seo_robots_follow = 1 on published products explicitly marked nofollow.
              #
              # `noindex` says "do not list this page"; `nofollow` says "and do not follow any link
              # on it", so the page stops passing signal to its category, brand and related
              # products. A live audit found 49 of the ORIGINAL catalogue in that state — C4
              # Original, Gold Creatine Kevin Levrone, Mass Gainer Eric Favre. Flagship SKUs acting
              # as dead ends. There is no product page for which nofollow is correct.
              #
              # The index flag is deliberately untouched: see catalog-reindex.
              ARGS="seo:products-robots-audit --apply"
              WRITES=yes
              ;;
            catalog-reindex)
              # The CORRECT way to reduce the noindexed population. It re-measures each held-back
              # product's body against catalog.promotion.min_body_words and flips only the ones that
              # now clear it — as opposed to forcing ~10,000 thin pages into the index, which costs
              # more than it gains. Creates nothing and publishes nothing.
              ARGS="catalog:iherb:promote --reindex"
              WRITES=yes
              ;;
            *)
              echo "::error::unknown task '$TASK'"
              exit 1
              ;;
          esac

          if [ "$WRITES" = "yes" ] && [ "$CONFIRM" != "APPLY" ]; then
            echo "::error::'$TASK' writes to the live database. Re-run it and type APPLY in the confirm box."
            exit 1
          fi

          echo "args=$ARGS"     >> "$GITHUB_OUTPUT"
          echo "writes=$WRITES" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"     >> "$GITHUB_OUTPUT"
          echo "svc=$SVC"       >> "$GITHUB_OUTPUT"
          echo "Resolved '$TASK' -> php artisan $ARGS   (writes: $WRITES)"

      - name: Checkout
        # Only so research.json is on the runner for the next step.
        if: startsWith(inputs.task, 'research-')
        uses: actions/checkout@v5

      # Ship research.json to the VPS - for the research tasks only.
      #
      # The file is committed (filament/storage/app/research.json) but is NOT in the container
      # image: filament/.dockerignore excludes /storage/app/*, and the only bind-mount on the
      # backend is storage/app/public. Without this step the import exits FAILURE with
      # "File not found" on the first click.
      #
      # Gated to research tasks because the hourly entry in filament/routes/console.php runs the
      # --apply import gated on this file existing. Shipping it from a task the dropdown calls
      # "read-only" would arm an unattended write to live product rows. Arming a write is a write.
      - name: Ship research.json to the VPS
        if: startsWith(inputs.task, 'research-')
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: filament/storage/app/research.json
          target: /root/sobitas-project/inbox
          strip_components: 3
          overwrite: true

      - name: Run the task
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          # A 500-product promotion wave is minutes of work, not seconds. Still bounded, so a
          # wedged command cannot hold the runner for ever.
          command_timeout: 3600s
          # No retry and no continue-on-error in this job. script_stop + set -e + a non-zero
          # artisan exit must turn the run RED, because the colour of that circle is the only
          # signal the owner gets. There is no poller behind this workflow to make a missed run
          # right later.
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/root/sobitas-project"
            COMPOSE_FILE="$APP_DIR/docker-compose.yml"
            ARGS="${{ steps.resolve.outputs.args }}"
            WRITES="${{ steps.resolve.outputs.writes }}"
            MODE="${{ steps.resolve.outputs.mode }}"
            SVC="${{ steps.resolve.outputs.svc }}"

            cd "$APP_DIR"

            if ! docker compose -f "$COMPOSE_FILE" exec -T backend-v2 test -f /tmp/.entrypoint-ready; then
              echo "[X] backend-v2 is not ready - a deploy is probably running right now."
              echo "    Wait two minutes and click Run workflow again."
              exit 1
            fi

            if [ -f "$APP_DIR/inbox/research.json" ]; then
              docker cp "$APP_DIR/inbox/research.json" sobitas-backend-v2:/var/www/html/storage/app/research.json
              docker exec -u root sobitas-backend-v2 chown www-data:www-data /var/www/html/storage/app/research.json
              echo "[ok] research.json delivered"
            fi

            if [ "$WRITES" = "yes" ]; then
              mkdir -p /var/sobitas/backups
              ls -1t /var/sobitas/backups/db-pre-command-*.sql.gz 2>/dev/null | tail -n +20 | xargs -r rm -f || true
              BACKUP="/var/sobitas/backups/db-pre-command-$(date +%Y%m%d-%H%M%S).sql.gz"
              if ! docker exec sobitas-mysql sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --triggers --databases "$MYSQL_DATABASE"' 2>/dev/null | gzip > "$BACKUP"; then
                echo "[X] database backup FAILED - refusing to run a writing command."
                rm -f "$BACKUP" || true
                exit 1
              fi
              echo "[ok] backup written: $BACKUP"
            fi

            if [ "$MODE" = "logs" ]; then
              # Container logs, not artisan. A job that dies between claim() and the write leaves
              # NOTHING on its staging row - the exception only exists in the worker's log, so
              # without this task the one place the answer lives is unreachable from here.
              echo ""
              echo "> docker compose logs --tail=200 $ARGS"
              echo ""
              docker compose -f "$COMPOSE_FILE" logs --tail=200 "$ARGS"
            elif [ "$MODE" = "filelog" ]; then
              # A file inside the container, not a container's stdout.
              #
              # The scheduler redirects each pass to its own file:
              #   catalog:iherb:content  >> storage/logs/catalog-content.log
              #   catalog:iherb:promote  >> storage/logs/catalog-promote.log
              # so `docker compose logs backend-v2-scheduler` shows only that the command RAN and
              # for how long - never what it decided. On 14/08 that distinction was the whole
              # problem: the content pass fires every five minutes, reports DONE in 2 seconds, and
              # has fetched nothing since 11/08. The reason exists in exactly one place, and until
              # now that place needed a shell.
              echo ""
              echo "> tail -n 300 storage/logs/$ARGS"
              echo ""
              docker compose -f "$COMPOSE_FILE" exec -T backend-v2 \
                sh -c "tail -n 300 /var/www/html/storage/logs/$ARGS 2>/dev/null || echo '(file does not exist - the pass has never written to it)'"
            else
              echo ""
              echo "> php artisan $ARGS"
              echo ""
              docker compose -f "$COMPOSE_FILE" exec -T -u www-data backend-v2 \
                php artisan $ARGS --no-interaction
            fi

            echo ""
            echo "[ok] finished."
