# Builds & pushes ghcr.io/declared-as-ala/sobitas-frontend-2 and restarts the VPS container.
#
# Triggers:
#   • Push to `main` that touches frontend-2/, docker-compose.yml, or this file.
#   • Manual: Actions → Deploy Frontend-2 → Run workflow (no extra inputs required).
#
# If your push does NOT start this workflow: merge to `main`, and ensure changed paths
# are under `frontend-2/` (GitHub path filters ignore commits that only touch e.g. `filament/`).
name: Deploy Frontend-2 (Docker Image)

on:
  push:
    branches: [main]
    paths:
      - "frontend-2/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-frontend-2.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: declared-as-ala/sobitas-frontend-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: |
          set -e
          test -f frontend-2/Dockerfile || (echo "❌ frontend-2/Dockerfile not found" && exit 1)
          echo "✓ frontend-2/Dockerfile found"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-2
          file: ./frontend-2/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://admin.sobitas.tn/api
            NEXT_PUBLIC_STORAGE_URL=https://admin.sobitas.tn/storage
            NEXT_PUBLIC_BASE_URL=https://sobitas.tn
            API_BACKEND_URL=https://admin.sobitas.tn/api
            STORAGE_BACKEND_URL=https://admin.sobitas.tn/storage
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 900s
          script_stop: true
          script: |
            set -e
            APP_DIR="/root/sobitas-project"
            COMPOSE_FILE="$APP_DIR/docker-compose.yml"

            cd "$APP_DIR"

            echo "📥 Updating docker-compose.yml..."
            git fetch origin main || true
            git checkout origin/main -- docker-compose.yml 2>/dev/null || true

            echo "🔐 Logging in to GHCR..."
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u declared-as-ala --password-stdin
            fi

            echo "📦 Pull latest frontend-2 image..."
            docker pull ghcr.io/declared-as-ala/sobitas-frontend-2:latest

            echo "🔄 Restart frontend-2..."
            docker rm -f sobitas-frontend-2 2>/dev/null || true
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps frontend-2

            echo "✅ Frontend-2 deploy done"
