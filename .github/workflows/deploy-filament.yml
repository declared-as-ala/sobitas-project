name: Deploy Filament Backend (Docker Image) - V2

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "filament/**"
      - "nginx/configuration.conf"
      - "docker-compose.yml"
      - ".github/workflows/deploy-filament.yml"
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Force enable this workflow (set to "true" to run)'
        required: false
        default: 'false'

# Per-workflow group, NOT a shared one. Sharing it was tried on 10/08/2026 and was worse:
# GitHub keeps at most ONE pending run per concurrency group, so with all three deploy
# workflows in one group the frontend deploy (#408) was CANCELLED outright rather than
# queued — a silently dropped deploy, which beats an intermittent failure only in that it
# fails quietly. SSH contention is handled by backoff between attempts instead.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: declared-as-ala/sobitas-backend-v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.enabled == 'true')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Dockerfile exists
        run: |
          set -e
          test -f filament/Dockerfile || (echo "❌ filament/Dockerfile not found" && exit 1)
          echo "✓ filament/Dockerfile found"

      - name: Validate Nginx configuration
        run: |
          set -e
          docker run --rm \
            -v "$PWD/nginx/configuration.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:stable nginx -t

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./filament
          file: ./filament/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test authentication and welcome credits before production
        run: |
          set -e
          docker run --rm --entrypoint php \
            -e APP_ENV=testing -e APP_KEY=base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI= \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e MAIL_MAILER=array \
            -v "$PWD/filament/tests:/var/www/html/tests:ro" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            vendor/bin/phpunit tests/Feature/CustomerAuthFlowTest.php

      - name: Test product alternatives and request emails before production
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/mail-previews"
          chmod 777 "$RUNNER_TEMP/mail-previews"
          docker run --rm --entrypoint php \
            -e APP_ENV=testing -e APP_KEY=base64:MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI= \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e MAIL_MAILER=array \
            -e MAIL_PREVIEW_DIR=/tmp/mail-previews \
            -v "$RUNNER_TEMP/mail-previews:/tmp/mail-previews" \
            -v "$PWD/filament/tests:/var/www/html/tests:ro" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            vendor/bin/phpunit tests/Feature/ProductRequestFlowTest.php

      - name: Save synthetic request email previews
        uses: actions/upload-artifact@v4
        with:
          name: product-request-email-previews
          path: ${{ runner.temp }}/mail-previews
          retention-days: 7

      # Ship docker-compose.yml to the VPS before deploying.
      #
      # Nothing ever synced it. The server's copy is whatever was last placed there by hand, and
      # the repo checkout at /root/sobitas-project cannot self-update — the fitness-api workflow
      # runs `git pull` in the same directory and logs "⚠️ git pull warning" every time.
      #
      # The result was silent: adding the `backend-v2-scheduler` service to this file did nothing,
      # and the deploy printed `no such service: backend-v2-scheduler` while still reporting
      # success. Any future service, port or env change to compose would have failed the same way.
      - name: Sync docker-compose.yml to VPS
        id: sync_compose
        # Non-blocking, but NOT forgiven — see "Fail workflow" at the foot of this job.
        #
        # This step used to be a hard gate, and that hid the cause of every failure since
        # 08/08/2026. When SSH auth broke, scp died first, the two deploy attempts were SKIPPED,
        # and the diagnostic step that exists precisely to explain the failure never ran. What the
        # owner saw was a drone-scp stack trace; what they needed was one line saying the password
        # was wrong.
        #
        # This does not soften the run: if the sync fails, the job still fails at the end, with a
        # message that says whether the compose file or the deploy was the problem. A stale
        # docker-compose.yml on the server is exactly the silent failure the sync was added to
        # prevent, so it is reported — just not in a way that suppresses the real diagnosis.
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Key first, password as fallback.
          #
          # appleboy/ssh-action uses the key when one is supplied and falls back to the password
          # when VPS_SSH_KEY is unset, so this is safe to merge before the key exists.
          #
          # Why it matters: on 07/08/2026 every deploy failed with
          #   ssh: handshake failed: unable to authenticate, attempted methods [none password]
          # The images built and pushed to GHCR fine; only the VPS step died, because the server
          # stopped accepting the password held in VPS_PASSWORD. A pipeline whose only credential
          # is a password breaks every time that password is rotated - and it has to be rotated,
          # so a key is the fix rather than a fresher password.
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # Nginx is a bind mount, not part of the PHP image. Syncing only docker-compose.yml meant
          # an SEO/status fix in nginx/configuration.conf could be committed, pass CI, recreate the
          # container, and still leave production using the VPS's stale file.
          source: docker-compose.yml,nginx/configuration.conf
          target: /root/sobitas-project
          overwrite: true

      - name: Deploy to VPS (attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Key first, password as fallback.
          #
          # appleboy/ssh-action uses the key when one is supplied and falls back to the password
          # when VPS_SSH_KEY is unset, so this is safe to merge before the key exists.
          #
          # Why it matters: on 07/08/2026 every deploy failed with
          #   ssh: handshake failed: unable to authenticate, attempted methods [none password]
          # The images built and pushed to GHCR fine; only the VPS step died, because the server
          # stopped accepting the password held in VPS_PASSWORD. A pipeline whose only credential
          # is a password breaks every time that password is rotated - and it has to be rotated,
          # so a key is the fix rather than a fresher password.
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 1200s
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/root/sobitas-project"
            COMPOSE_FILE="$APP_DIR/docker-compose.yml"
            IMAGE="ghcr.io/declared-as-ala/sobitas-backend-v2:latest"

            cd "$APP_DIR"

            [ -f .env ] || { [ -f filament/.env.example ] && cp filament/.env.example .env || touch .env; }

            # Keep transactional SMS credentials in GitHub Secrets and install them into the
            # persistent VPS environment without ever printing their values. All web, queue and
            # scheduler containers consume this same .env file through docker-compose.
            upsert_secret() {
              SECRET_KEY="$1"
              SECRET_VALUE="$2"
              SECRET_TMP=".env.tmp.$$"
              # Do not place a secret in sed replacement syntax: `&`, `|` and `\`
              # have special meanings there and can silently corrupt SMTP passwords.
              grep -v "^${SECRET_KEY}=" .env > "$SECRET_TMP" || true
              printf '%s=%s\n' "$SECRET_KEY" "$SECRET_VALUE" >> "$SECRET_TMP"
              mv "$SECRET_TMP" .env
              chmod 600 .env
            }

            [ -n '${{ secrets.SMS_API_KEY }}' ] || { echo "❌ SMS_API_KEY GitHub secret is missing"; exit 1; }
            [ -n '${{ secrets.SMS_SENDER_ID }}' ] || { echo "❌ SMS_SENDER_ID GitHub secret is missing"; exit 1; }
            upsert_secret SMS_API_KEY '${{ secrets.SMS_API_KEY }}'
            upsert_secret SMS_SENDER_ID '${{ secrets.SMS_SENDER_ID }}'
            echo "✓ WinSMS credentials installed"

            [ -n '${{ secrets.MAIL_USERNAME }}' ] || { echo "❌ MAIL_USERNAME GitHub secret is missing"; exit 1; }
            [ -n '${{ secrets.MAIL_PASSWORD }}' ] || { echo "❌ MAIL_PASSWORD GitHub secret is missing"; exit 1; }
            upsert_secret MAIL_MAILER smtp
            upsert_secret MAIL_HOST smtp.gmail.com
            upsert_secret MAIL_PORT 587
            upsert_secret MAIL_USERNAME '${{ secrets.MAIL_USERNAME }}'
            upsert_secret MAIL_PASSWORD '${{ secrets.MAIL_PASSWORD }}'
            upsert_secret MAIL_ENCRYPTION tls
            upsert_secret MAIL_FROM_ADDRESS '${{ secrets.MAIL_USERNAME }}'
            upsert_secret MAIL_FROM_NAME Protein.tn
            upsert_secret MAIL_REPLY_TO contact@protein.tn
            upsert_secret FRONTEND_URL https://protein.tn
            upsert_secret ADMIN_EMAILS bitoutawalid@gmail.com
            echo "✓ Gmail SMTP credentials installed"

            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u declared-as-ala --password-stdin

            echo "🧹 Docker cleanup (old dangling images only)..."
            docker image prune -f || true

            echo "📦 Pull latest image..."
            docker pull "$IMAGE"

            echo "🔍 Start dependencies..."
            # A backend image release must never recreate stateful dependencies. On 29/08 three
            # newly committed orders disappeared during this exact deploy window while only app
            # code was changing. The existing healthy DB/Redis containers are dependencies, not
            # release artifacts; migrations run from backend-v2 after it is recreated below.
            docker compose -f "$COMPOSE_FILE" up -d --no-recreate mysql redis

            echo "🗄️  Pre-deploy database backup (safety net before migrate --force)..."
            # A safety net must never become a gate. On 2026-07-28 this block killed three
            # consecutive deploys 0.1s after the echo above — exit 2, far too fast for mysqldump to
            # have run at all — and the SEO scheduler container sat unshipped for a day as a result.
            #
            # Cause: `gzip > "$BACKUP_FILE"` could not CREATE the file (the VPS filled up). A
            # redirection failure is a fatal shell error, so it killed the whole script outright:
            # it bypassed both `set -e`'s if-condition exemption AND the else-branch below that was
            # written to tolerate exactly this. The tolerant branch never got a chance to run.
            #
            # Two fixes. Prune BEFORE writing — retention that only runs after a successful write
            # can never free the space that write needs. And probe writability inside a SUBSHELL,
            # so a fatal redirect kills the subshell and is caught here as a plain false.
            # ── THE SHARED LOG DIRECTORY, PREPARED BEFORE ANY CONTAINER MOUNTS IT ───────
            # docker-compose now bind-mounts /var/sobitas/logs into all four backend services so
            # they write to ONE place that survives a deploy. That mount is only safe if the host
            # directory exists and www-data can write to it: Laravel's log handler throws
            # `UnexpectedValueException: The stream or file could not be opened` when it cannot,
            # and on a fresh container that surfaces as a 500 rather than as a missing log.
            #
            # uid/gid 33 is www-data on the Debian base these images use. Numeric on purpose —
            # the name does not exist on the HOST, only inside the container.
            mkdir -p /var/sobitas/logs 2>/dev/null || true
            chown -R 33:33 /var/sobitas/logs 2>/dev/null || true
            chmod 775 /var/sobitas/logs 2>/dev/null || true

            mkdir -p /var/sobitas/backups 2>/dev/null || true
            # Keep the 29 newest, so the one about to be written lands inside the cap of 30.
            ls -1t /var/sobitas/backups/db-pre-deploy-*.sql.gz 2>/dev/null | tail -n +30 | xargs -r rm -f || true
            BACKUP_FILE="/var/sobitas/backups/db-pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            if ( : > "$BACKUP_FILE" ) 2>/dev/null; then
              if docker exec sobitas-mysql sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --triggers --databases "$MYSQL_DATABASE"' 2>/dev/null | gzip > "$BACKUP_FILE"; then
                echo "✓ Backup written: $BACKUP_FILE ($(du -h "$BACKUP_FILE" 2>/dev/null | cut -f1))"
              else
                echo "⚠️  WARNING: pre-deploy DB backup FAILED — continuing deploy, but investigate backups on the VPS!"
                rm -f "$BACKUP_FILE" || true
              fi
            else
              rm -f "$BACKUP_FILE" 2>/dev/null || true
              echo "⚠️  WARNING: /var/sobitas/backups is not writable — SKIPPING the backup and continuing the deploy."
              df -h /var 2>&1 | sed 's/^/    /'
            fi

            if ! grep -q 'APP_KEY=base64:' .env 2>/dev/null; then
              echo "🔑 APP_KEY missing, generating..."
              KEY=$(docker compose -f "$COMPOSE_FILE" run --rm backend-v2 php artisan key:generate --show 2>/dev/null || true)
              [ -n "$KEY" ] && echo "APP_KEY=$KEY" >> .env && echo "✓ APP_KEY added to .env"
            fi

            echo "🩺 Checking SMTP and SMS configuration (no messages are sent)..."
            # This is an observability check, not a deployment prerequisite. Keep any provider
            # warning prominent without preventing an unrelated image or Nginx rollout.
            if ! docker compose -f "$COMPOSE_FILE" run --rm backend-v2 php artisan notifications:doctor --strict --probe-sms; then
              echo "⚠️  Notification configuration needs attention; continuing the deploy."
            fi

            echo "🔄 Recreating backend container with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2

            echo "⏳ Waiting for backend readiness marker..."
            READY=0
            for i in $(seq 1 120); do
              if docker compose -f "$COMPOSE_FILE" exec -T backend-v2 test -f /tmp/.entrypoint-ready; then
                READY=1
                echo "✅ Backend is ready"
                break
              fi
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "❌ Backend did not become ready in time"
              docker compose -f "$COMPOSE_FILE" logs --tail=200 backend-v2 || true
              exit 1
            fi

            # Entrypoint deliberately keeps the shop available if a migration fails.
            # The deployment must nevertheless fail rather than report a false success.
            docker compose -f "$COMPOSE_FILE" exec -T backend-v2 php artisan migrate --force

            echo "📋 Refreshing shared public volume..."
            docker compose -f "$COMPOSE_FILE" run --rm backend-v2-public-init

            echo "🔄 Recreating nginx..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-nginx-v2

            echo "🔄 Recreating queue worker with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2-queue

            echo "⏰ Recreating scheduler with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2-scheduler

            echo "📋 Final status:"
            docker compose -f "$COMPOSE_FILE" ps

            echo "🩺 Last backend logs:"
            docker compose -f "$COMPOSE_FILE" logs --tail=50 backend-v2 || true

            echo "🚀 Deploy complete!"

      - name: Back off before retrying SSH
        # The retry used to fire instantly, which is the one timing guaranteed to fail again.
        #
        # Every push starts three deploy workflows (filament, frontend, fitness-api) and all three
        # SSH into the same VPS at the same second. Measured 10/08/2026: run #935 deployed cleanly
        # at 08:10 and #936 was refused at 08:25 with "unable to authenticate", while frontend run
        # #407 from the same push succeeded — and a credential-free probe confirmed the server was
        # still accepting passwords. That is contention, not a bad secret.
        #
        # A shared concurrency group was tried and was worse: GitHub keeps only one PENDING run per
        # group, so it cancelled the frontend deploy outright. Waiting is the cheap, correct answer
        # — 90 seconds is longer than the other workflows' SSH phases, so the retry lands in a quiet
        # window instead of the same pile-up.
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: |
          echo "Attempt 1 failed. Waiting 90s so a concurrent deploy's SSH session can finish."
          sleep 90

      - name: Deploy to VPS (attempt 2 on transient SSH failure)
        if: steps.deploy_attempt_1.outcome == 'failure'
        id: push_to_vps
        # Soft, so the verdict step below is always reached and can explain the failure in one
        # line. The run still fails there — this changes which message the owner reads, not
        # whether a broken deploy is reported as broken.
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Key first, password as fallback.
          #
          # appleboy/ssh-action uses the key when one is supplied and falls back to the password
          # when VPS_SSH_KEY is unset, so this is safe to merge before the key exists.
          #
          # Why it matters: on 07/08/2026 every deploy failed with
          #   ssh: handshake failed: unable to authenticate, attempted methods [none password]
          # The images built and pushed to GHCR fine; only the VPS step died, because the server
          # stopped accepting the password held in VPS_PASSWORD. A pipeline whose only credential
          # is a password breaks every time that password is rotated - and it has to be rotated,
          # so a key is the fix rather than a fresher password.
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 1200s
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/root/sobitas-project"
            COMPOSE_FILE="$APP_DIR/docker-compose.yml"
            IMAGE="ghcr.io/declared-as-ala/sobitas-backend-v2:latest"

            cd "$APP_DIR"

            [ -f .env ] || { [ -f filament/.env.example ] && cp filament/.env.example .env || touch .env; }

            upsert_secret() {
              SECRET_KEY="$1"
              SECRET_VALUE="$2"
              SECRET_TMP=".env.tmp.$$"
              grep -v "^${SECRET_KEY}=" .env > "$SECRET_TMP" || true
              printf '%s=%s\n' "$SECRET_KEY" "$SECRET_VALUE" >> "$SECRET_TMP"
              mv "$SECRET_TMP" .env
              chmod 600 .env
            }

            [ -n '${{ secrets.SMS_API_KEY }}' ] || { echo "❌ SMS_API_KEY GitHub secret is missing"; exit 1; }
            [ -n '${{ secrets.SMS_SENDER_ID }}' ] || { echo "❌ SMS_SENDER_ID GitHub secret is missing"; exit 1; }
            upsert_secret SMS_API_KEY '${{ secrets.SMS_API_KEY }}'
            upsert_secret SMS_SENDER_ID '${{ secrets.SMS_SENDER_ID }}'
            echo "✓ WinSMS credentials installed"

            [ -n '${{ secrets.MAIL_USERNAME }}' ] || { echo "❌ MAIL_USERNAME GitHub secret is missing"; exit 1; }
            [ -n '${{ secrets.MAIL_PASSWORD }}' ] || { echo "❌ MAIL_PASSWORD GitHub secret is missing"; exit 1; }
            upsert_secret MAIL_MAILER smtp
            upsert_secret MAIL_HOST smtp.gmail.com
            upsert_secret MAIL_PORT 587
            upsert_secret MAIL_USERNAME '${{ secrets.MAIL_USERNAME }}'
            upsert_secret MAIL_PASSWORD '${{ secrets.MAIL_PASSWORD }}'
            upsert_secret MAIL_ENCRYPTION tls
            upsert_secret MAIL_FROM_ADDRESS '${{ secrets.MAIL_USERNAME }}'
            upsert_secret MAIL_FROM_NAME Protein.tn
            upsert_secret MAIL_REPLY_TO contact@protein.tn
            upsert_secret FRONTEND_URL https://protein.tn
            upsert_secret ADMIN_EMAILS bitoutawalid@gmail.com
            echo "✓ Gmail SMTP credentials installed"

            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u declared-as-ala --password-stdin

            echo "🧹 Docker cleanup (old dangling images only)..."
            docker image prune -f || true

            echo "📦 Pull latest image..."
            docker pull "$IMAGE"

            echo "🔍 Start dependencies..."
            # Retry path must carry the same stateful-container guard as attempt 1.
            docker compose -f "$COMPOSE_FILE" up -d --no-recreate mysql redis

            echo "🗄️  Pre-deploy database backup (safety net before migrate --force)..."
            # A safety net must never become a gate. On 2026-07-28 this block killed three
            # consecutive deploys 0.1s after the echo above — exit 2, far too fast for mysqldump to
            # have run at all — and the SEO scheduler container sat unshipped for a day as a result.
            #
            # Cause: `gzip > "$BACKUP_FILE"` could not CREATE the file (the VPS filled up). A
            # redirection failure is a fatal shell error, so it killed the whole script outright:
            # it bypassed both `set -e`'s if-condition exemption AND the else-branch below that was
            # written to tolerate exactly this. The tolerant branch never got a chance to run.
            #
            # Two fixes. Prune BEFORE writing — retention that only runs after a successful write
            # can never free the space that write needs. And probe writability inside a SUBSHELL,
            # so a fatal redirect kills the subshell and is caught here as a plain false.
            mkdir -p /var/sobitas/backups 2>/dev/null || true
            # Keep the 29 newest, so the one about to be written lands inside the cap of 30.
            ls -1t /var/sobitas/backups/db-pre-deploy-*.sql.gz 2>/dev/null | tail -n +30 | xargs -r rm -f || true
            BACKUP_FILE="/var/sobitas/backups/db-pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            if ( : > "$BACKUP_FILE" ) 2>/dev/null; then
              if docker exec sobitas-mysql sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --triggers --databases "$MYSQL_DATABASE"' 2>/dev/null | gzip > "$BACKUP_FILE"; then
                echo "✓ Backup written: $BACKUP_FILE ($(du -h "$BACKUP_FILE" 2>/dev/null | cut -f1))"
              else
                echo "⚠️  WARNING: pre-deploy DB backup FAILED — continuing deploy, but investigate backups on the VPS!"
                rm -f "$BACKUP_FILE" || true
              fi
            else
              rm -f "$BACKUP_FILE" 2>/dev/null || true
              echo "⚠️  WARNING: /var/sobitas/backups is not writable — SKIPPING the backup and continuing the deploy."
              df -h /var 2>&1 | sed 's/^/    /'
            fi

            if ! grep -q 'APP_KEY=base64:' .env 2>/dev/null; then
              echo "🔑 APP_KEY missing, generating..."
              KEY=$(docker compose -f "$COMPOSE_FILE" run --rm backend-v2 php artisan key:generate --show 2>/dev/null || true)
              [ -n "$KEY" ] && echo "APP_KEY=$KEY" >> .env && echo "✓ APP_KEY added to .env"
            fi

            echo "🩺 Checking SMTP and SMS configuration (no messages are sent)..."
            # Keep diagnostics visible, but do not turn a notification warning into a false SSH
            # failure after the image has already been pulled and the pre-deploy backup completed.
            if ! docker compose -f "$COMPOSE_FILE" run --rm backend-v2 php artisan notifications:doctor --strict --probe-sms; then
              echo "⚠️  Notification configuration needs attention; continuing the deploy."
            fi

            echo "🔄 Recreating backend container with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2

            echo "⏳ Waiting for backend readiness marker..."
            READY=0
            for i in $(seq 1 120); do
              if docker compose -f "$COMPOSE_FILE" exec -T backend-v2 test -f /tmp/.entrypoint-ready; then
                READY=1
                echo "✅ Backend is ready"
                break
              fi
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "❌ Backend did not become ready in time"
              docker compose -f "$COMPOSE_FILE" logs --tail=200 backend-v2 || true
              exit 1
            fi

            docker compose -f "$COMPOSE_FILE" exec -T backend-v2 php artisan migrate --force

            echo "📋 Refreshing shared public volume..."
            docker compose -f "$COMPOSE_FILE" run --rm backend-v2-public-init

            echo "🔄 Recreating nginx..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-nginx-v2

            echo "🔄 Recreating queue worker with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2-queue

            echo "⏰ Recreating scheduler with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2-scheduler

            echo "📋 Final status:"
            docker compose -f "$COMPOSE_FILE" ps

            echo "🩺 Last backend logs:"
            docker compose -f "$COMPOSE_FILE" logs --tail=50 backend-v2 || true

            echo "🚀 Deploy complete!"

      - name: Fail workflow when both attempts failed
        # Stays a hard failure, on purpose.
        #
        # This workflow OWNS the deploy: SSH is how the new image reaches the server, so an
        # unreachable VPS means the site did not update, and the run must say so. It was briefly
        # softened to a warning during the outage of 07-08/08/2026 — that was correct only while the
        # server was expected to pull for itself, and the moment SSH worked again a green check on a
        # failed deploy would have been a lie of exactly the kind this project has been bitten by
        # before (PRs #183/#184 reported green with the old image still running).
        #
        # The whole outage was one cause: the VPS password was rotated in Hostinger and
        # VPS_PASSWORD in GitHub was not updated. Set VPS_SSH_KEY and that class of failure stops
        # recurring, because a key does not change when a password does.
        # `always()` because the two steps above are now soft: without it this step inherits the
        # default `success()` and is skipped exactly when it is needed most.
        #
        # And the retry is now actually honoured. The old condition tested attempt 1 alone, so a
        # deploy that failed once and SUCCEEDED on the retry still exited 1 here — the retry could
        # never produce a green run, which made it decorative. It now fails only when attempt 2
        # did not succeed.
        if: >-
          always() && (
            steps.sync_compose.outcome == 'failure' ||
            (steps.deploy_attempt_1.outcome == 'failure' && steps.push_to_vps.outcome != 'success')
          )
        run: |
          FAILED=0

          if [ "${{ steps.sync_compose.outcome }}" = "failure" ]; then
            echo "❌ Could not copy docker-compose.yml to the server."
            FAILED=1
          fi

          if [ "${{ steps.deploy_attempt_1.outcome }}" = "failure" ]; then
            echo "❌ SSH deploy failed — the new image did NOT reach the server."
            FAILED=1
          fi

          if [ "$FAILED" = "1" ]; then
            echo ""
            echo "   The image itself built and is in GHCR. Only the VPS steps failed, and both"
            echo "   fail on the same thing: authentication."
            echo ""
            echo "   Diagnosed 10/08/2026 by asking the server directly, with no credential:"
            echo "     ssh -o PreferredAuthentications=none root@<host>"
            echo "     → Permission denied (publickey,password)"
            echo ""
            echo "   The server DOES accept passwords. So VPS_PASSWORD does not hold the server's"
            echo "   current root password — updating it is the entire fix."
            echo ""
            echo "     1. Hostinger → VPS → Settings → Root password → set a new one."
            echo "        Use letters and digits ONLY. The previous password contained ) ' and #,"
            echo "        and quote characters are the classic way a password arrives mangled."
            echo "     2. GitHub → Settings → Secrets and variables → Actions → VPS_PASSWORD →"
            echo "        Update. No leading or trailing space, no newline."
            echo "     3. Re-run this workflow."
            echo ""
            echo "   Run the 'VPS Doctor' workflow any time this recurs — it names the cause"
            echo "   without using any credential at all."
            exit 1
          fi

      # ── EVERY ROUTE TYPE MUST STILL ANSWER 200 AFTER A BACKEND DEPLOY ──────────────────────
      #
      # This workflow had no live check at all, and on 13/08/2026 that cost the site its blog for a
      # day: a product-only eager load was added to the ARTICLE endpoint, Eloquent raised
      # RelationNotFoundException, and all 224 article URLs served 500. The image built, the deploy
      # was green, and `/blog` itself stayed 200 because it runs through a different method — so
      # nothing anywhere reported a problem while Google was being handed 5xx on the best-ranking
      # pages the site owns.
      #
      # A PHP relation is resolved at request time. No build step, no typecheck and no container
      # health check can see it. Only fetching the page can, which is why this asks the live site.
      #
      # `if: always()` because the SSH steps above routinely fail on this host while the deploy
      # itself still lands — the VPS pulls the new image on its own poll (scripts/vps-autodeploy.sh).
      # Skipping the check whenever SSH was unhappy would skip it on exactly the deploys nobody
      # watched.
      - name: Every route type still answers 200
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "Waiting for the API to serve the new image..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://admin.protein.tn/api/categories?per_page=1 || echo 000)
            [ "$code" = "200" ] && break
            sleep 20
          done
          cd frontend && node scripts/check-routes.mjs

      - name: Report what actually happened
        if: always()
        run: |
          {
            echo "### Image built and published to GHCR"
            echo ""
            if [ "${{ steps.push_to_vps.outcome }}" = "success" ]; then
              echo "The VPS was asked to pull it immediately, and did."
            else
              echo "Could not reach the VPS over SSH (outcome: ${{ steps.push_to_vps.outcome }})."
              echo ""
              echo "**This does not mean the deploy failed.** The image is in the registry and the"
              echo "server pulls it itself on its next poll - see scripts/vps-autodeploy.sh."
              echo "If the site has not changed after a few minutes, the poller is not installed:"
              echo ""
              echo "    crontab -l | grep vps-autodeploy"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
