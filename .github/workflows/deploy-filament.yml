name: Deploy Filament Backend (Docker Image) - V2

on:
  push:
    branches: [main]
    paths:
      - "filament/**"
      - "docker-compose.yml"
      - "nginx/**"
      - ".github/workflows/deploy-filament.yml"
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Force enable this workflow (set to "true" to run)'
        required: false
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: declared-as-ala/sobitas-backend-v2
  # Username for GHCR (owner of the package). Use secret GHCR_USERNAME to override.
  GHCR_USERNAME: declared-as-ala

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # For workflow_dispatch, only run if enabled=true
    # For push events, paths filter in on: section already handles filtering
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.enabled == 'true')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: |
          set -e
          test -f filament/Dockerfile || (echo "❌ filament/Dockerfile not found" && exit 1)
          echo "✓ filament/Dockerfile found"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./filament
          file: ./filament/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 900s
          script_stop: true
          script: |
            set -e
            APP_DIR="/root/sobitas-project"
            COMPOSE_FILE="$APP_DIR/docker-compose.yml"

            cd "$APP_DIR"

            [ -f .env ] || { [ -f filament/.env.example ] && cp filament/.env.example .env || touch .env; }

            echo "📥 Updating docker-compose.yml..."
            git fetch origin main || true
            git checkout origin/main -- docker-compose.yml 2>/dev/null || true

            echo "🔐 Logging in to GHCR..."
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u declared-as-ala --password-stdin
            fi

            echo "🧹 Docker cleanup (free disk space before pull)..."
            docker image prune -af || true

            echo "📦 Pull latest image..."
            docker pull ghcr.io/declared-as-ala/sobitas-backend-v2:latest

            echo "🔍 Start deps..."
            docker compose -f "$COMPOSE_FILE" up -d mysql redis

            if ! grep -q 'APP_KEY=base64:' .env 2>/dev/null; then
              KEY=$(docker compose -f "$COMPOSE_FILE" run --rm backend-v2 php artisan key:generate --show 2>/dev/null || true)
              [ -n "$KEY" ] && echo "APP_KEY=$KEY" >> .env && echo "✓ APP_KEY added to .env"
            fi

            # ══════════════════════════════════════════════════════════
            # 1. Recreate backend container (new image, fresh process)
            # ══════════════════════════════════════════════════════════
            echo "🔄 Recreating backend container..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2

            # ══════════════════════════════════════════════════════════
            # 2. Wait for entrypoint to finish.
            #    The entrypoint handles: composer sync, migrations,
            #    cache rebuild — all BEFORE starting php-fpm.
            #    Simple sleep is reliable with script_stop: true.
            # ══════════════════════════════════════════════════════════
            echo "⏳ Waiting 45s for entrypoint to finish..."
            sleep 45
            echo "✅ Continuing with post-deploy tasks"

            # ══════════════════════════════════════════════════════════
            # 3. Copy public assets to shared nginx volume
            # ══════════════════════════════════════════════════════════
            echo "📋 Init public volume..."
            docker compose -f "$COMPOSE_FILE" run --rm backend-v2-public-init

            echo "🔄 Restart nginx..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-nginx-v2

            # ══════════════════════════════════════════════════════════
            # 4. Post-deploy: explicit cache rebuild + FPM reload
            #    The entrypoint already did this before FPM started,
            #    but we redo it as a safety net in case the persistent
            #    storage volume held stale compiled views/config.
            #    Every command is || true so script_stop cannot abort.
            # ══════════════════════════════════════════════════════════
            echo "🔄 Post-deploy cache safety net..."
            docker compose -f "$COMPOSE_FILE" exec -T backend-v2 php artisan optimize:clear 2>/dev/null || true
            docker compose -f "$COMPOSE_FILE" exec -T backend-v2 php artisan config:cache 2>/dev/null || true
            docker compose -f "$COMPOSE_FILE" exec -T backend-v2 php artisan route:cache 2>/dev/null || true
            docker compose -f "$COMPOSE_FILE" exec -T backend-v2 php artisan view:cache 2>/dev/null || true
            docker compose -f "$COMPOSE_FILE" exec -T backend-v2 php artisan event:cache 2>/dev/null || true
            docker compose -f "$COMPOSE_FILE" exec -T backend-v2 php artisan filament:assets 2>/dev/null || true
            echo "✅ Cache rebuilt"

            echo "🔄 Restarting queue workers with new code..."
            docker compose -f "$COMPOSE_FILE" exec -T backend-v2 php artisan queue:restart 2>/dev/null || true

            echo "♻️  Graceful PHP-FPM reload (clear stale OPcache)..."
            docker compose -f "$COMPOSE_FILE" exec -T backend-v2 kill -USR2 1 2>/dev/null || true

            echo ""
            echo "🚀 Deploy complete!"
