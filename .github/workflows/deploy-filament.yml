name: Deploy Filament Backend

on:
  push:
    branches:
      - main
    paths:
      - "filament/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-filament.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 1200s
          script_stop: true
          envs: GH_TOKEN
          script: |
            set -e
            APP_DIR="/root/sobitas-project"

            # Authenticate git over HTTPS using token
            git config --global credential.helper store
            echo "https://x-access-token:${GH_TOKEN}@github.com" > ~/.git-credentials

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 Cloning repo for the first time..."
              git clone https://x-access-token:${GH_TOKEN}@github.com/declared-as-ala/sobitas-project.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Building backend image..."
            docker compose build --no-cache backend-v2

            echo "🔍 Starting dependencies..."
            docker compose up -d mysql redis

            echo "🔄 Restarting backend container..."
            docker compose up -d --force-recreate --no-deps backend-v2

            echo "⏳ Waiting for backend to be ready..."
            READY=0
            for i in $(seq 1 60); do
              if docker compose exec -T backend-v2 test -f /tmp/.entrypoint-ready 2>/dev/null; then
                READY=1
                echo "✅ Backend is ready"
                break
              fi
              sleep 3
            done

            if [ "$READY" -ne 1 ]; then
              echo "❌ Backend did not become ready in time"
              docker compose logs --tail=100 backend-v2 || true
              exit 1
            fi

            echo "📋 Refreshing public volume..."
            docker compose run --rm backend-v2-public-init || true

            echo "🔄 Restarting nginx and queue worker..."
            docker compose up -d --force-recreate --no-deps backend-nginx-v2
            docker compose up -d --force-recreate --no-deps backend-v2-queue

            echo "🧹 Cleaning unused images..."
            docker image prune -f || true

            echo "📋 Container status:"
            docker compose ps

            echo "✅ Backend deploy done"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
