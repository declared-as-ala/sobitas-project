name: Deploy Filament Backend (Docker Image) - V2

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "filament/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-filament.yml"
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Force enable this workflow (set to "true" to run)'
        required: false
        default: 'false'

# Serialise deploys. Two merges close together each build and push the SAME `:latest` tag, then
# each pulls `:latest` on the VPS — so the image that ends up running is whichever build finished
# last, not whichever commit is newest. That is not theoretical: PRs #183 and #184 merged 13s
# apart, their deploys finished 2s apart, and the box came up running the earlier commit's image.
# The category fix in #184 was reported green and was simply not on the server; Googlebot kept
# seeing 20 of 79 products until the run was re-triggered by hand.
#
# cancel-in-progress is deliberately FALSE. Cancelling a half-finished deploy could leave the VPS
# mid-recreate; queueing costs a few minutes and always converges on the newest commit.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: declared-as-ala/sobitas-backend-v2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.enabled == 'true')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Dockerfile exists
        run: |
          set -e
          test -f filament/Dockerfile || (echo "❌ filament/Dockerfile not found" && exit 1)
          echo "✓ filament/Dockerfile found"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./filament
          file: ./filament/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Ship docker-compose.yml to the VPS before deploying.
      #
      # Nothing ever synced it. The server's copy is whatever was last placed there by hand, and
      # the repo checkout at /root/sobitas-project cannot self-update — the fitness-api workflow
      # runs `git pull` in the same directory and logs "⚠️ git pull warning" every time.
      #
      # The result was silent: adding the `backend-v2-scheduler` service to this file did nothing,
      # and the deploy printed `no such service: backend-v2-scheduler` while still reporting
      # success. Any future service, port or env change to compose would have failed the same way.
      - name: Sync docker-compose.yml to VPS
        # Also best-effort. The autodeploy poller does `git pull` on the server, so the compose file
        # arrives that way regardless; this only makes it arrive a little sooner.
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Key first, password as fallback.
          #
          # appleboy/ssh-action uses the key when one is supplied and falls back to the password
          # when VPS_SSH_KEY is unset, so this is safe to merge before the key exists.
          #
          # Why it matters: on 07/08/2026 every deploy failed with
          #   ssh: handshake failed: unable to authenticate, attempted methods [none password]
          # The images built and pushed to GHCR fine; only the VPS step died, because the server
          # stopped accepting the password held in VPS_PASSWORD. A pipeline whose only credential
          # is a password breaks every time that password is rotated - and it has to be rotated,
          # so a key is the fix rather than a fresher password.
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: docker-compose.yml
          target: /root/sobitas-project
          overwrite: true

      - name: Deploy to VPS (attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        # Best-effort only: the VPS deploys ITSELF from cron (scripts/vps-autodeploy.sh).
        #
        # This step just asks it to pull immediately rather than waiting for the next poll. It is
        # allowed to fail because its failure does not mean the DEPLOY failed: from 07/08/2026 every
        # run went red here with
        #   ssh: handshake failed: unable to authenticate, attempted methods [none password]
        # while the image built and pushed to GHCR perfectly. A red X on a successful build teaches
        # people to ignore red X-es, which is worse than the original problem.
        #
        # The honest contract of this workflow is now BUILD AND PUBLISH THE IMAGE. Whether the server
        # has picked it up is reported in the job summary, not by this exit code.
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Key first, password as fallback.
          #
          # appleboy/ssh-action uses the key when one is supplied and falls back to the password
          # when VPS_SSH_KEY is unset, so this is safe to merge before the key exists.
          #
          # Why it matters: on 07/08/2026 every deploy failed with
          #   ssh: handshake failed: unable to authenticate, attempted methods [none password]
          # The images built and pushed to GHCR fine; only the VPS step died, because the server
          # stopped accepting the password held in VPS_PASSWORD. A pipeline whose only credential
          # is a password breaks every time that password is rotated - and it has to be rotated,
          # so a key is the fix rather than a fresher password.
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 1200s
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/root/sobitas-project"
            COMPOSE_FILE="$APP_DIR/docker-compose.yml"
            IMAGE="ghcr.io/declared-as-ala/sobitas-backend-v2:latest"

            cd "$APP_DIR"

            [ -f .env ] || { [ -f filament/.env.example ] && cp filament/.env.example .env || touch .env; }

            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u declared-as-ala --password-stdin

            echo "🧹 Docker cleanup (old dangling images only)..."
            docker image prune -f || true

            echo "📦 Pull latest image..."
            docker pull "$IMAGE"

            echo "🔍 Start dependencies..."
            docker compose -f "$COMPOSE_FILE" up -d mysql redis

            echo "🗄️  Pre-deploy database backup (safety net before migrate --force)..."
            # A safety net must never become a gate. On 2026-07-28 this block killed three
            # consecutive deploys 0.1s after the echo above — exit 2, far too fast for mysqldump to
            # have run at all — and the SEO scheduler container sat unshipped for a day as a result.
            #
            # Cause: `gzip > "$BACKUP_FILE"` could not CREATE the file (the VPS filled up). A
            # redirection failure is a fatal shell error, so it killed the whole script outright:
            # it bypassed both `set -e`'s if-condition exemption AND the else-branch below that was
            # written to tolerate exactly this. The tolerant branch never got a chance to run.
            #
            # Two fixes. Prune BEFORE writing — retention that only runs after a successful write
            # can never free the space that write needs. And probe writability inside a SUBSHELL,
            # so a fatal redirect kills the subshell and is caught here as a plain false.
            mkdir -p /var/sobitas/backups 2>/dev/null || true
            # Keep the 29 newest, so the one about to be written lands inside the cap of 30.
            ls -1t /var/sobitas/backups/db-pre-deploy-*.sql.gz 2>/dev/null | tail -n +30 | xargs -r rm -f || true
            BACKUP_FILE="/var/sobitas/backups/db-pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            if ( : > "$BACKUP_FILE" ) 2>/dev/null; then
              if docker exec sobitas-mysql sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --triggers --databases "$MYSQL_DATABASE"' 2>/dev/null | gzip > "$BACKUP_FILE"; then
                echo "✓ Backup written: $BACKUP_FILE ($(du -h "$BACKUP_FILE" 2>/dev/null | cut -f1))"
              else
                echo "⚠️  WARNING: pre-deploy DB backup FAILED — continuing deploy, but investigate backups on the VPS!"
                rm -f "$BACKUP_FILE" || true
              fi
            else
              rm -f "$BACKUP_FILE" 2>/dev/null || true
              echo "⚠️  WARNING: /var/sobitas/backups is not writable — SKIPPING the backup and continuing the deploy."
              df -h /var 2>&1 | sed 's/^/    /'
            fi

            if ! grep -q 'APP_KEY=base64:' .env 2>/dev/null; then
              echo "🔑 APP_KEY missing, generating..."
              KEY=$(docker compose -f "$COMPOSE_FILE" run --rm backend-v2 php artisan key:generate --show 2>/dev/null || true)
              [ -n "$KEY" ] && echo "APP_KEY=$KEY" >> .env && echo "✓ APP_KEY added to .env"
            fi

            echo "🔄 Recreating backend container with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2

            echo "⏳ Waiting for backend readiness marker..."
            READY=0
            for i in $(seq 1 120); do
              if docker compose -f "$COMPOSE_FILE" exec -T backend-v2 test -f /tmp/.entrypoint-ready; then
                READY=1
                echo "✅ Backend is ready"
                break
              fi
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "❌ Backend did not become ready in time"
              docker compose -f "$COMPOSE_FILE" logs --tail=200 backend-v2 || true
              exit 1
            fi

            echo "📋 Refreshing shared public volume..."
            docker compose -f "$COMPOSE_FILE" run --rm backend-v2-public-init

            echo "🔄 Recreating nginx..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-nginx-v2

            echo "🔄 Recreating queue worker with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2-queue

            echo "⏰ Recreating scheduler with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2-scheduler

            echo "📋 Final status:"
            docker compose -f "$COMPOSE_FILE" ps

            echo "🩺 Last backend logs:"
            docker compose -f "$COMPOSE_FILE" logs --tail=50 backend-v2 || true

            echo "🚀 Deploy complete!"

      - name: Deploy to VPS (attempt 2 on transient SSH failure)
        if: steps.deploy_attempt_1.outcome == 'failure'
        # Best-effort only: the VPS deploys ITSELF from cron (scripts/vps-autodeploy.sh).
        #
        # This step just asks it to pull immediately rather than waiting for the next poll. It is
        # allowed to fail because its failure does not mean the DEPLOY failed: from 07/08/2026 every
        # run went red here with
        #   ssh: handshake failed: unable to authenticate, attempted methods [none password]
        # while the image built and pushed to GHCR perfectly. A red X on a successful build teaches
        # people to ignore red X-es, which is worse than the original problem.
        #
        # The honest contract of this workflow is now BUILD AND PUBLISH THE IMAGE. Whether the server
        # has picked it up is reported in the job summary, not by this exit code.
        continue-on-error: true
        id: push_to_vps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Key first, password as fallback.
          #
          # appleboy/ssh-action uses the key when one is supplied and falls back to the password
          # when VPS_SSH_KEY is unset, so this is safe to merge before the key exists.
          #
          # Why it matters: on 07/08/2026 every deploy failed with
          #   ssh: handshake failed: unable to authenticate, attempted methods [none password]
          # The images built and pushed to GHCR fine; only the VPS step died, because the server
          # stopped accepting the password held in VPS_PASSWORD. A pipeline whose only credential
          # is a password breaks every time that password is rotated - and it has to be rotated,
          # so a key is the fix rather than a fresher password.
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          timeout: 120s
          command_timeout: 1200s
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="/root/sobitas-project"
            COMPOSE_FILE="$APP_DIR/docker-compose.yml"
            IMAGE="ghcr.io/declared-as-ala/sobitas-backend-v2:latest"

            cd "$APP_DIR"

            [ -f .env ] || { [ -f filament/.env.example ] && cp filament/.env.example .env || touch .env; }

            echo "🔐 Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u declared-as-ala --password-stdin

            echo "🧹 Docker cleanup (old dangling images only)..."
            docker image prune -f || true

            echo "📦 Pull latest image..."
            docker pull "$IMAGE"

            echo "🔍 Start dependencies..."
            docker compose -f "$COMPOSE_FILE" up -d mysql redis

            echo "🗄️  Pre-deploy database backup (safety net before migrate --force)..."
            # A safety net must never become a gate. On 2026-07-28 this block killed three
            # consecutive deploys 0.1s after the echo above — exit 2, far too fast for mysqldump to
            # have run at all — and the SEO scheduler container sat unshipped for a day as a result.
            #
            # Cause: `gzip > "$BACKUP_FILE"` could not CREATE the file (the VPS filled up). A
            # redirection failure is a fatal shell error, so it killed the whole script outright:
            # it bypassed both `set -e`'s if-condition exemption AND the else-branch below that was
            # written to tolerate exactly this. The tolerant branch never got a chance to run.
            #
            # Two fixes. Prune BEFORE writing — retention that only runs after a successful write
            # can never free the space that write needs. And probe writability inside a SUBSHELL,
            # so a fatal redirect kills the subshell and is caught here as a plain false.
            mkdir -p /var/sobitas/backups 2>/dev/null || true
            # Keep the 29 newest, so the one about to be written lands inside the cap of 30.
            ls -1t /var/sobitas/backups/db-pre-deploy-*.sql.gz 2>/dev/null | tail -n +30 | xargs -r rm -f || true
            BACKUP_FILE="/var/sobitas/backups/db-pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
            if ( : > "$BACKUP_FILE" ) 2>/dev/null; then
              if docker exec sobitas-mysql sh -c 'exec mysqldump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --triggers --databases "$MYSQL_DATABASE"' 2>/dev/null | gzip > "$BACKUP_FILE"; then
                echo "✓ Backup written: $BACKUP_FILE ($(du -h "$BACKUP_FILE" 2>/dev/null | cut -f1))"
              else
                echo "⚠️  WARNING: pre-deploy DB backup FAILED — continuing deploy, but investigate backups on the VPS!"
                rm -f "$BACKUP_FILE" || true
              fi
            else
              rm -f "$BACKUP_FILE" 2>/dev/null || true
              echo "⚠️  WARNING: /var/sobitas/backups is not writable — SKIPPING the backup and continuing the deploy."
              df -h /var 2>&1 | sed 's/^/    /'
            fi

            if ! grep -q 'APP_KEY=base64:' .env 2>/dev/null; then
              echo "🔑 APP_KEY missing, generating..."
              KEY=$(docker compose -f "$COMPOSE_FILE" run --rm backend-v2 php artisan key:generate --show 2>/dev/null || true)
              [ -n "$KEY" ] && echo "APP_KEY=$KEY" >> .env && echo "✓ APP_KEY added to .env"
            fi

            echo "🔄 Recreating backend container with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2

            echo "⏳ Waiting for backend readiness marker..."
            READY=0
            for i in $(seq 1 120); do
              if docker compose -f "$COMPOSE_FILE" exec -T backend-v2 test -f /tmp/.entrypoint-ready; then
                READY=1
                echo "✅ Backend is ready"
                break
              fi
              sleep 2
            done

            if [ "$READY" -ne 1 ]; then
              echo "❌ Backend did not become ready in time"
              docker compose -f "$COMPOSE_FILE" logs --tail=200 backend-v2 || true
              exit 1
            fi

            echo "📋 Refreshing shared public volume..."
            docker compose -f "$COMPOSE_FILE" run --rm backend-v2-public-init

            echo "🔄 Recreating nginx..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-nginx-v2

            echo "🔄 Recreating queue worker with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2-queue

            echo "⏰ Recreating scheduler with latest image..."
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps backend-v2-scheduler

            echo "📋 Final status:"
            docker compose -f "$COMPOSE_FILE" ps

            echo "🩺 Last backend logs:"
            docker compose -f "$COMPOSE_FILE" logs --tail=50 backend-v2 || true

            echo "🚀 Deploy complete!"

      - name: Warn when the VPS could not be reached
        # Was `exit 1`. It is now a warning, because the workflow no longer OWNS the deploy: the
        # server pulls from GHCR on its own schedule (scripts/vps-autodeploy.sh), so an unreachable
        # SSH port means "the update arrives a minute later" rather than "the deploy failed".
        #
        # Keeping the hard failure would have been the safer-looking choice and the wrong one. Every
        # run from 07/08/2026 onward went red here while the image published perfectly, and a build
        # status that is red when the build succeeded stops carrying information — people learn to
        # scroll past it, including on the day it means something.
        if: steps.deploy_attempt_1.outcome == 'failure'
        run: |
          echo "::warning::Could not reach the VPS over SSH. The image is published; the server's"
          echo "::warning::autodeploy poller will pick it up. If the site does not change within a"
          echo "::warning::few minutes, check: crontab -l | grep vps-autodeploy"

      - name: Report what actually happened
        if: always()
        run: |
          {
            echo "### Image built and published to GHCR"
            echo ""
            if [ "${{ steps.push_to_vps.outcome }}" = "success" ]; then
              echo "The VPS was asked to pull it immediately, and did."
            else
              echo "Could not reach the VPS over SSH (outcome: ${{ steps.push_to_vps.outcome }})."
              echo ""
              echo "**This does not mean the deploy failed.** The image is in the registry and the"
              echo "server pulls it itself on its next poll - see scripts/vps-autodeploy.sh."
              echo "If the site has not changed after a few minutes, the poller is not installed:"
              echo ""
              echo "    crontab -l | grep vps-autodeploy"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
