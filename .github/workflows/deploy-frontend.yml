name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 900s
          script_stop: true
          envs: GITHUB_TOKEN
          script: |
            set -e
            APP_DIR="/root/sobitas-project"

            # Inject token so git can pull private repo
            git config --global credential.helper store
            printf 'https://x-access-token:%s@github.com\n' "$GITHUB_TOKEN" > ~/.git-credentials

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "📦 Cloning repo..."
              git clone https://x-access-token:${GITHUB_TOKEN}@github.com/declared-as-ala/sobitas-project.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Building frontend image..."
            docker compose build --no-cache frontend

            echo "🔄 Restarting frontend container..."
            docker compose up -d --force-recreate --no-deps frontend

            echo "🧹 Cleaning unused images..."
            docker image prune -f || true

            echo "✅ Frontend deploy done"
        env:
          GITHUB_TOKEN: ${{ github.token }}
