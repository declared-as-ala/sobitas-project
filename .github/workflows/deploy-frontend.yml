name: Deploy Frontend (Docker Image)

# Single workflow for frontend: lint + Next build, then Docker image + VPS deploy.
on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

# Per-workflow group, NOT a shared one. Sharing it was tried on 10/08/2026 and was worse:
# GitHub keeps at most ONE pending run per concurrency group, so with all three deploy
# workflows in one group the frontend deploy (#408) was CANCELLED outright rather than
# queued — a silently dropped deploy, which beats an intermittent failure only in that it
# fails quietly. SSH contention is handled by backoff between attempts instead.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: declared-as-ala/sobitas-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Dockerfile exists
        run: |
          set -e
          test -f frontend/Dockerfile || (echo "❌ frontend/Dockerfile not found" && exit 1)
          echo "✓ frontend/Dockerfile found"

      # Node 24, matching frontend/Dockerfile and frontend/.nvmrc.
      #
      # `npm run build` runs the prebuild chain, and scripts/check-sitemap-crawl.mjs imports
      # src/util/sitemapCrawl.ts by its .ts path so the check drives the shipping code. Type
      # stripping exists from Node 22.6; on Node 20 — what this step used to pin — the runtime
      # rejects the flag with exit 9 and the build never reaches next build. The Dockerfile carries
      # the same pin, because the image build runs the same npm script.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # ── ONE RETRY, BECAUSE THE BUILD DEPENDS ON A THIRD-PARTY CDN ──────────────────────
      # layout.tsx loads four families through next/font/google (Inter, Noto Sans Arabic, Archivo,
      # Poppins), so EVERY build has to reach fonts.gstatic.com. On 13/08/2026 that fetch failed,
      # next/font exhausted its own 3 internal retries and then threw
      # `TypeError: Cannot read properties of null (reading '1')`, and the whole deploy failed with
      # no code change involved — a contrast fix sat unshipped while the live page still measured
      # its six failures.
      #
      # A retry is a mitigation, not the cure. The real fix is to vendor the woff2 files and switch
      # to next/font/local, which removes the network from the build entirely; that needs the font
      # files committed and is tracked separately. Until then one clean retry turns the common case
      # (a transient CDN blip) from a failed deploy into a slower one.
      - name: Build (Next.js)
        run: npm run build || (echo "::warning::build failed once — retrying, usually a next/font CDN blip" && sleep 15 && npm run build)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://protein.tn/api-proxy
          NEXT_PUBLIC_STORAGE_URL: https://admin.protein.tn/storage

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://protein.tn/api-proxy
            NEXT_PUBLIC_STORAGE_URL=https://admin.protein.tn/storage
            API_BACKEND_URL=http://backend-nginx-v2/api
            STORAGE_BACKEND_URL=http://backend-nginx-v2/storage
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        id: push_to_vps
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          # Key first, password as fallback.
          #
          # appleboy/ssh-action uses the key when one is supplied and falls back to the password
          # when VPS_SSH_KEY is unset, so this is safe to merge before the key exists.
          #
          # Why it matters: on 07/08/2026 every deploy failed with
          #   ssh: handshake failed: unable to authenticate, attempted methods [none password]
          # The images built and pushed to GHCR fine; only the VPS step died, because the server
          # stopped accepting the password held in VPS_PASSWORD. A pipeline whose only credential
          # is a password breaks every time that password is rotated - and it has to be rotated,
          # so a key is the fix rather than a fresher password.
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 900s
          script_stop: true
          script: |
            set -e
            APP_DIR="/root/sobitas-project"
            cd "$APP_DIR"

            echo "🔐 Logging in to GHCR..."
            # Non-fatal: if the GHCR_PAT secret is expired/invalid, a login failure must NOT
            # abort the deploy when the image is public. The `docker pull` below stays strict
            # under `set -e`, so a genuinely unreachable image still fails honestly (no false success).
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u declared-as-ala --password-stdin \
              || echo "⚠️  GHCR login failed (token likely expired) — continuing; pull will succeed only if the image is public."

            echo "📦 Pull latest frontend image..."
            docker pull ghcr.io/declared-as-ala/sobitas-frontend:latest

            echo "🔄 Restart frontend..."
            docker compose up -d --force-recreate --no-deps frontend

            echo "🧹 Cleaning unused images..."
            docker image prune -f || true

            echo "✅ Frontend deploy done"

      # ── POST-DEPLOY SMOKE TESTS AGAINST THE LIVE SITE ──────────────────────────────────────
      #
      # Three bugs reached production on 13/08/2026, and every one of them passed typecheck, passed
      # the build, and answered HTTP 200 while being wrong:
      #
      #   1. /shop navigated itself in a loop — /shop -> ?max_price=1000 -> /shop, twelve times in
      #      six seconds. It only existed once React had mounted and run its effects, so nothing
      #      static could see it, and it also wiped ?page=N on arrival.
      #   2. Every product page emitted schema.org/OutOfStock while the visible page correctly said
      #      "Sur commande" — availability has two authors and the PHP one silently wins.
      #   3. The brand list was serialised into /shop twice, 36 KB of exact duplicate.
      #
      # The common property is that none was visible at a layer cheaper than the rendered output. So
      # these run against the DEPLOYED site, after the deploy, and they are the reason a fourth one
      # of this class should not reach a customer.
      #
      # continue-on-error, deliberately: the deploy has already happened by this point and failing
      # the job would not undo it. What this must do is make the failure LOUD in the run summary,
      # not pretend the release can be recalled.
      - name: Smoke test the live site
        id: smoke
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "Waiting for the new container to answer..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://protein.tn/shop || echo 000)
            [ "$code" = "200" ] && break
            sleep 15
          done

          fail=0
          cd frontend

          # FIRST, and shallowest. The three checks below are deep checks of one surface each and
          # every one of them is about products; on 13/08/2026 all three passed while all 224 article
          # URLs served 500. A page that does not answer cannot be audited for anything else, so
          # "does every route type answer 200" runs before any question about what a page contains.
          echo "::group::every route type answers 200"
          node scripts/check-routes.mjs || fail=1
          echo "::endgroup::"

          echo "::group::availability schema"
          node scripts/check-availability-schema.mjs || fail=1
          echo "::endgroup::"

          echo "::group::card hover endpoints"
          node scripts/check-hover-endpoints.mjs || fail=1
          echo "::endgroup::"

          echo "::group::self-navigation (needs a browser)"
          # Chrome ships on the GitHub runner image; puppeteer's own download is unreliable here.
          export CHROME_PATH="${CHROME_PATH:-/usr/bin/google-chrome}"
          if [ -x "$CHROME_PATH" ]; then
            node scripts/check-shop-no-loop.mjs || fail=1
          else
            echo "::warning::no Chrome at $CHROME_PATH — the redirect-loop check did not run"
          fi
          echo "::endgroup::"

          if [ "$fail" = "1" ]; then
            echo "::error::Live smoke tests FAILED. The deploy is already out — investigate now."
            exit 1
          fi
          echo "All live smoke tests passed."

      - name: Report what actually happened
        if: always()
        run: |
          {
            echo "### Image built and published to GHCR"
            echo ""
            if [ "${{ steps.smoke.outcome }}" = "failure" ]; then
              echo "**LIVE SMOKE TESTS FAILED.** The release is already serving. See the"
              echo "\"Smoke test the live site\" step for which check broke."
              echo ""
            fi
            if [ "${{ steps.push_to_vps.outcome }}" = "success" ]; then
              echo "The VPS was asked to pull it immediately, and did."
            else
              echo "Could not reach the VPS over SSH (outcome: ${{ steps.push_to_vps.outcome }})."
              echo ""
              echo "**This does not mean the deploy failed.** The image is in the registry and the"
              echo "server pulls it itself on its next poll - see scripts/vps-autodeploy.sh."
              echo "If the site has not changed after a few minutes, the poller is not installed:"
              echo ""
              echo "    crontab -l | grep vps-autodeploy"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
