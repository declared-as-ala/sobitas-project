name: Deploy Frontend (Docker Image)

# Single workflow for frontend: lint + Next build, then Docker image + VPS deploy.
# (Removed duplicate `frontend-deploy.yml` so push only creates one Actions run.)
on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: declared-as-ala/sobitas-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Dockerfile exists
        run: |
          set -e
          test -f frontend/Dockerfile || (echo "❌ frontend/Dockerfile not found" && exit 1)
          echo "✓ frontend/Dockerfile found"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build (Next.js)
        run: npm run build
        working-directory: frontend
        env:
          # NEXT_PUBLIC_STORAGE_URL must match the docker-compose runtime value so that
          # SSR-rendered image src attributes are identical to client-rendered ones.
          # Using the direct backend URL eliminates React hydration mismatches.
          NEXT_PUBLIC_API_URL: https://protein.tn/api-proxy
          NEXT_PUBLIC_STORAGE_URL: https://admin.protein.tn/storage

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://protein.tn/api-proxy
            NEXT_PUBLIC_STORAGE_URL=https://admin.protein.tn/storage
            API_BACKEND_URL=http://backend-nginx-v2/api
            STORAGE_BACKEND_URL=http://backend-nginx-v2/storage
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 900s
          script_stop: true
          script: |
            set -e
            APP_DIR="/root/sobitas-project"
            COMPOSE_FILE="$APP_DIR/docker-compose.yml"

            cd "$APP_DIR"

            echo "📥 Updating docker-compose.yml..."
            git fetch origin main || true
            git checkout origin/main -- docker-compose.yml 2>/dev/null || true

            echo "🔐 Logging in to GHCR..."
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u declared-as-ala --password-stdin
            fi

            echo "📦 Pull latest frontend image..."
            docker pull ghcr.io/declared-as-ala/sobitas-frontend:latest

            echo "🔄 Restart frontend..."
            docker rm -f sobitas-frontend 2>/dev/null || true
            docker compose -f "$COMPOSE_FILE" up -d --force-recreate --no-deps frontend

            echo "✅ Frontend deploy done"
