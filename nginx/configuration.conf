# ==============================================================
# Nginx Configuration — Filament v2 Backend (admin.protein.tn)
# ==============================================================
#
#   Container               Port        Domain              Upstream (PHP-FPM)
#   ─────────────────────── ────────    ──────────────────   ─────────────────────────
#   backend-nginx-v2        8083:80     admin.protein.tn     sobitas-backend-v2:9000
#
# Public traffic flow (via Nginx Proxy Manager):
#   admin.protein.tn  → NPM → 127.0.0.1:8083 → sobitas-backend-v2:9000
#
# ==============================================================

# ---- Gzip compression ----------------------------------------
gzip              on;
gzip_comp_level   5;
gzip_min_length   256;
gzip_proxied      any;
gzip_vary         on;
gzip_types
    application/atom+xml
    application/javascript
    application/json
    application/ld+json
    application/manifest+json
    application/rss+xml
    application/vnd.geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-web-app-manifest+json
    application/xhtml+xml
    application/xml
    font/opentype
    image/bmp
    image/svg+xml
    image/x-icon
    text/cache-manifest
    text/css
    text/plain
    text/vcard
    text/vtt
    text/x-component
    text/x-cross-domain-policy
    text/xml;

# ---- CORS origin map -----------------------------------------
# Sets $cors_origin to the request Origin if it matches a trusted domain,
# or to "" otherwise. Used by add_header at server level.
map $http_origin $cors_origin {
    default  "";
    ~^https?://(protein\.tn|www\.protein\.tn|sobitas\.tn|www\.sobitas\.tn|localhost(:[0-9]+)?)$  $http_origin;
}

# ==============================================================
# Filament admin v2  (admin.protein.tn)
# Upstream: sobitas-backend-v2:9000  |  Port: 8083
# ==============================================================
server {
    listen 80 default_server;
    server_name admin.protein.tn _;

    # Docker embedded DNS — re-resolve upstream when backend container is recreated (new IP).
    # Without this, nginx caches the old IP from startup → 502 Connection refused to PHP-FPM.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root  /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64M;

    # ---- CORS headers (applied to all responses) -------------
    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Credentials "true"       always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Accept, Authorization, Cache-Control, Content-Type, Pragma, Expires, X-Requested-With" always;

    # ---- Security headers ------------------------------------
    add_header X-Frame-Options        "SAMEORIGIN"                      always;
    add_header X-Content-Type-Options "nosniff"                         always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection       "1; mode=block"                  always;

    # ---- Placeholder SVG for missing images ------------------
    location = /placeholder.svg {
        root /var/www/html/public;
        internal;
    }

    # ---- Retired public-prefix URLs from the pre-migration backend -------
    # The old storefront exposed its API as /public/api/*. The current backend serves /api/*
    # directly, and none of the /public/* addresses can ever become valid again. Search Console
    # still retries 21 of them because a normal 404 reads as "not here today"; 410 is the explicit
    # permanent-retirement signal. This sits above Laravel routing, so it also avoids booting PHP.
    location ^~ /public/ {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    # ---- Storage files (uploaded images, documents) ----------
    # Served directly from the host bind-mount via alias (does not follow
    # the volume symlink, so files are always current even mid-deploy).
    # 7-day TTL with stale-while-revalidate so browsers refresh in the
    # background without showing a broken image during revalidation.
    # ETag is on by default in nginx — conditional requests save bandwidth.
    location ^~ /storage/ {
        if ($uri ~ "^/storage/\\.") { return 404; }
        alias /var/www/html/storage/app/public/;
        access_log off;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        # Existing uploads are served normally. A missing immutable upload path is not a Laravel
        # route and will never materialise under the same URL, so retire it explicitly rather than
        # leaving stale /storage/undefined and legacy category-image URLs as recurring 404s.
        error_page 404 = @retired_storage;
    }

    location @retired_storage {
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    # ---- Vite build directory (immutable hashed filenames) ---
    location ^~ /build/ {
        try_files $uri =404;
        expires    1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ---- Laravel routing + CORS preflight --------------------
    location / {
        # Handle OPTIONS preflight here (add_header is valid inside if-in-location)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $cors_origin always;
            add_header Access-Control-Allow-Credentials "true"       always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers     "Accept, Authorization, Cache-Control, Content-Type, Pragma, Expires, X-Requested-With" always;
            add_header Access-Control-Max-Age           86400;
            return 204;
        }
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- Generic static assets (Filament panel: CSS, JS, fonts, inline images) --
    # These are hashed at build time so a 30-day TTL is safe.
    # /storage/* is handled by the ^~ block above and never reaches here.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2?|ttf|eot|webp|map)$ {
        try_files $uri /index.php?$query_string;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---- PHP-FPM → Filament backend v2 ----------------------
    location ~ \.php$ {
        include        fastcgi_params;
        set $fastcgi_upstream "sobitas-backend-v2:9000";
        fastcgi_pass   $fastcgi_upstream;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $document_root;
        fastcgi_param  REQUEST_URI     $request_uri;

        fastcgi_buffering        off;
        fastcgi_keep_conn        on;
        fastcgi_buffer_size      4k;
        fastcgi_buffers          8 4k;
        fastcgi_busy_buffers_size 8k;
        fastcgi_read_timeout     60s;
        fastcgi_send_timeout     60s;
        fastcgi_connect_timeout  5s;
    }

    # ---- Block sensitive / hidden files ----------------------
    location ~ /\.(?!well-known).* { deny all; }
    location ~* /(composer\.(json|lock)|package\.json|\.env|webpack\.mix\.js|vite\.config\.js)$ { deny all; }
}

# ==============================================================
# protein.tn — Canonical redirects (301 → https://protein.tn)
# ==============================================================
# These apply when the nginx that receives protein.tn traffic uses this config.
# In your setup, protein.tn is likely handled by Nginx Proxy Manager (NPM);
# add the same redirects there (or in the host nginx that fronts NPM) for full effect.
# ==============================================================

# ---- WWW (HTTP) → canonical HTTPS ----
server {
    listen 80;
    server_name www.protein.tn;
    return 301 https://protein.tn$request_uri;
}

# ---- Non-WWW (HTTP) → HTTPS ----
server {
    listen 80;
    server_name protein.tn;
    return 301 https://protein.tn$request_uri;
}
