# ==============================================================
# sobitas-project — Filament (Laravel) + MySQL + Redis + Next.js
#
# Image persistence strategy:
#   Uploaded files → host bind-mount at:
#     /var/sobitas/uploads  (outside git — git can NEVER delete these files)
#   Both php-fpm (backend-v2) and nginx (backend-nginx-v2) mount
#   this same host path so uploads are never lost on redeploy.
#
# Nginx public assets (CSS/JS) → named volume backend-v2-public
#   Synced by backend-v2-public-init on every deploy (non-destructive).
#
# Storage URL:  https://admin.protein.tn/storage/<relative-path>
# ==============================================================

# ── LOG ROTATION. THIS IS NOT HOUSEKEEPING; IT IS AN OUTAGE FIX. ─────────────────────────────
#
# Docker's default json-file driver has NO SIZE LIMIT. Every service here inherited that, and
# backend-v2 runs with LOG_CHANNEL=stderr — so every Laravel log line, including every warning from
# a 10,669-product import, went into a file that could only ever grow.
#
# A full disk on this box does not look like a full disk. It looks like admin.protein.tn answering
# 504 on every URL after exactly 60 seconds, because MySQL cannot write, so every PHP worker blocks
# on it, so the proxy gives up. It has already happened once in a different guise: on 2026-07-28 the
# pre-deploy mysqldump died 0.1s in because it could not CREATE its output file, and took three
# consecutive deploys with it.
#
# 10 MB x 3 files x ~10 services caps container logs at roughly 300 MB, permanently.
#
# ROTATION APPLIES TO CONTAINERS CREATED AFTER THIS CHANGE. `docker compose restart` does NOT
# recreate a container and will NOT pick it up — it needs `docker compose up -d`.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: sobitas-mysql
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-protein_db}
      MYSQL_USER: ${MYSQL_USER:-laravel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      # Bind to localhost ONLY — the DB must never be reachable from the public
      # internet. The app connects over the internal Docker network (mysql:3306);
      # for admin access use an SSH tunnel to 127.0.0.1:3307. (Takes effect the
      # next time the mysql container is recreated.) Also: set strong, unique
      # MYSQL_ROOT_PASSWORD / MYSQL_PASSWORD in the VPS .env — never the defaults.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - sobitas-net
      - sobitas-full-net
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sobitas-redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - sobitas-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-} ping | grep PONG >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend-v2:
    image: ghcr.io/declared-as-ala/sobitas-backend-v2:latest
    container_name: sobitas-backend-v2
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-protein_db}
      DB_USERNAME: ${MYSQL_USER:-laravel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}

      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://admin.protein.tn
      ASSET_URL: https://admin.protein.tn
      FILESYSTEM_DISK: public
      FILESYSTEM_DRIVER: public

      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr

      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1

      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: nachdit.customers@gmail.com
      MAIL_FROM_NAME: Protein.tn
    networks:
      - sobitas-net
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Host bind-mount: uploaded files persist across container recreations.
      # php-fpm writes here; nginx reads the same host directory via its own mount.
      - /var/sobitas/uploads:/var/www/html/storage/app/public
    # ── THE CHECK THAT WAS MISSING WHEN admin.protein.tn WENT DOWN ───────────────────────────
    #
    # This service had `restart: unless-stopped` and no healthcheck, and that pairing is a trap:
    # `unless-stopped` only acts when the process EXITS. A php-fpm pool with every worker blocked on
    # a slow database does not exit. It accepts connections and never answers them, Docker reports
    # `Up 6 days`, and the first anyone hears about it is a customer — which is precisely what
    # happened, with every URL on admin.protein.tn returning 504 after exactly 60s.
    #
    # ── WHY IT CALLS NGINX INSTEAD OF CHECKING ITSELF ────────────────────────────────────────
    # The obvious check is "is something listening on 9000". It is also useless here, because an
    # exhausted pool still accepts the TCP connection — it queues it in the listen backlog and never
    # replies. The socket test would have stayed green throughout the outage.
    #
    # Going out through nginx and back into php-fpm exercises the ENTIRE path a customer uses:
    # nginx → fpm → MySQL. /api/coordonnees is chosen for it because it is unauthenticated, tiny,
    # and touches the database. If that cannot answer in 15s, the site is down whatever `docker ps`
    # thinks.
    #
    # Tuned deliberately not to flap: 3 consecutive failures at 30s intervals means ~90s of genuine
    # unavailability before this goes red. A healthcheck that trips on one slow request would have
    # a watchdog restarting a working site under load, which is worse than no watchdog at all.
    healthcheck:
      # `$$x`, not `$x`. Compose interpolates `$NAME` in this file BEFORE Docker ever sees it, so a
      # single `$` would have shipped `php -r '=stream_context_create(...)'` — a parse error that
      # exits non-zero, marking the container unhealthy forever and sending the watchdog into a
      # restart loop against a perfectly healthy site. `$$` is the escape for a literal `$`.
      #
      # No `ignore_errors` either: without it, file_get_contents returns false on any non-2xx, so a
      # 500 from Laravel counts as down. With it, a 500 returns a body and would pass — a green
      # healthcheck on a broken application is worse than none.
      test:
        - CMD-SHELL
        - php -r '$$x=stream_context_create(["http"=>["timeout"=>12]]); exit(@file_get_contents("http://backend-nginx-v2/api/coordonnees",false,$$x)===false?1:0);'
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  # Laravel task scheduler.
  #
  # This service did not exist before 2026-07-28. routes/console.php had defined scheduled SEO
  # commands for a long time, but nothing was executing them — no cron on the host, no
  # schedule:work process — so every one of them had never run. A schedule with no runner fails
  # silently, which is exactly the class of problem the SEO watchdog it now runs exists to catch.
  #
  # `schedule:work` is used rather than a host crontab so the schedule ships with the image and
  # cannot drift from the code that defines it.
  backend-v2-scheduler:
    image: ghcr.io/declared-as-ala/sobitas-backend-v2:latest
    container_name: sobitas-backend-v2-scheduler
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-protein_db}
      DB_USERNAME: ${MYSQL_USER:-laravel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://admin.protein.tn
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      # ── THE THREE LINES THIS SERVICE WAS MISSING, AND WHAT THEY COST ────────────────────
      # backend-v2 (line 87), backend-v2-queue (line 177) and fitness-api (line 249) all pin
      # REDIS_HOST to the service name. This service did not, so it fell through to `.env`,
      # where REDIS_HOST is `127.0.0.1` — correct for a host process, and inside a container it
      # points at the container itself, where nothing listens on 6379.
      #
      # Measured on production 11/08/2026:
      #   backend-v2            host=redis
      #   backend-v2-queue      host=redis
      #   backend-v2-scheduler  host=127.0.0.1   <- RedisException: Connection refused
      #
      # The failure mode is the worst available: `schedule:work` KEEPS RUNNING and keeps logging
      # "No scheduled commands are ready to run", because it only touches Redis when a command is
      # actually due — and then `withoutOverlapping()` cannot take its mutex and the command dies
      # before executing. So `schedule:list` shows every entry with a healthy "Next Due", the
      # container is `Up`, the deploy is green, and NOTHING HAS EVER RUN. Every scheduled command
      # in routes/console.php was affected: the SEO watchdog, self-heal, review requests, the
      # nutrition enrichment, and both catalogue crawls.
      #
      # The three lines above it (CACHE/SESSION/QUEUE_CONNECTION: redis) are what made it fatal
      # rather than merely wrong: they route the scheduler's cache — and therefore every
      # overlap mutex — at a Redis it cannot reach.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: php artisan schedule:work
    networks:
      - sobitas-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/sobitas/uploads:/var/www/html/storage/app/public

  backend-v2-queue:
    image: ghcr.io/declared-as-ala/sobitas-backend-v2:latest
    container_name: sobitas-backend-v2-queue
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-protein_db}
      DB_USERNAME: ${MYSQL_USER:-laravel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}

      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://admin.protein.tn
      FILESYSTEM_DISK: public
      FILESYSTEM_DRIVER: public

      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr

      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1

      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: nachdit.customers@gmail.com
      MAIL_FROM_NAME: Protein.tn
    command: >
      php artisan queue:work redis
      --sleep=3
      --tries=3
      --max-time=3600
    networks:
      - sobitas-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/sobitas/uploads:/var/www/html/storage/app/public

  backend-v2-public-init:
    image: ghcr.io/declared-as-ala/sobitas-backend-v2:latest
    container_name: sobitas-backend-v2-public-init
    restart: "no"
    logging: *default-logging
    networks:
      - sobitas-net
    volumes:
      - backend-v2-public:/public
      - /var/sobitas/uploads:/var/www/html/storage/app/public
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== Syncing public assets to nginx volume (non-destructive) ==="
        cp -a /var/www/html/public/. /public/
        ln -sfn /var/www/html/storage/app/public /public/storage
        echo "✓ Public assets synced"
        echo "✓ Storage symlink: /public/storage -> /var/www/html/storage/app/public"
        ls -la /public/storage 2>/dev/null || echo "⚠ Warning: storage symlink not visible"

  backend-nginx-v2:
    image: nginx:stable
    container_name: sobitas-laravel-nginx-v2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8083:80"
    networks:
      - sobitas-net
    depends_on:
      - backend-v2
    volumes:
      - backend-v2-public:/var/www/html/public:ro
      - /var/sobitas/uploads:/var/www/html/storage/app/public:ro
      - ./nginx/configuration.conf:/etc/nginx/conf.d/default.conf:ro

  fitness-api:
    image: ghcr.io/declared-as-ala/sobitas-fitness-api:latest
    build:
      context: ./fitness-api
      dockerfile: Dockerfile
    container_name: sobitas-fitness-api
    restart: unless-stopped
    logging: *default-logging
    environment:
      PORT: 4000
      DATABASE_URL: mysql://laravel:secret@mysql:3306/protein_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      NODE_ENV: production
    ports:
      - "4000:4000"
    networks:
      - sobitas-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/declared-as-ala/sobitas-frontend:latest
    container_name: sobitas-frontend
    restart: unless-stopped
    logging: *default-logging
    environment:
      NODE_ENV: production
      # NEXT_PUBLIC_* are baked into the client bundle at build time by CI.
      # Setting them here only affects server-side process.env reads (Server Components).
      # Both must match the CI build-args in deploy-frontend.yml to prevent
      # React hydration mismatches (SSR URL ≠ client URL → images flash/disappear).
      NEXT_PUBLIC_API_URL: https://protein.tn/api-proxy
      NEXT_PUBLIC_STORAGE_URL: https://admin.protein.tn/storage
      # Server-side rewrite targets: use internal Docker DNS (avoids the public internet).
      API_BACKEND_URL: http://backend-nginx-v2/api
      STORAGE_BACKEND_URL: http://backend-nginx-v2/storage
    ports:
      - "3001:3000"
    volumes:
      # Persist Next's optimized-image cache across deploys. Without it the cache is wiped every
      # release and the first visitor to each image pays a full upstream fetch + sharp transcode
      # — on the homepage that lands directly on the LCP element.
      - frontend-image-cache:/app/.next/cache/images
    networks:
      - sobitas-net

volumes:
  frontend-image-cache:
  mysql-data:
  redis-data:
  backend-v2-public:

networks:
  sobitas-net:
    driver: bridge
  sobitas-full-net:
    external: true
    name: sobitas-full-project_sobitas-net