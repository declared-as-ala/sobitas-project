# ==============================================================
# sobitas-project — Filament (Laravel) + MySQL + Redis + Next.js
#
# Image persistence strategy:
#   Uploaded files → host bind-mount at:
#     /var/sobitas/uploads  (outside git — git can NEVER delete these files)
#   Both php-fpm (backend-v2) and nginx (backend-nginx-v2) mount
#   this same host path so uploads are never lost on redeploy.
#
# Nginx public assets (CSS/JS) → named volume backend-v2-public
#   Synced by backend-v2-public-init on every deploy (non-destructive).
#
# Storage URL:  https://admin.protein.tn/storage/<relative-path>
# ==============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: sobitas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-protein_db}
      MYSQL_USER: ${MYSQL_USER:-laravel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - sobitas-net
      - sobitas-full-net
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: sobitas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - sobitas-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-} ping | grep PONG >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend-v2:
    image: ghcr.io/declared-as-ala/sobitas-backend-v2:latest
    container_name: sobitas-backend-v2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-protein_db}
      DB_USERNAME: ${MYSQL_USER:-laravel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}

      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://admin.protein.tn
      ASSET_URL: https://admin.protein.tn
      FILESYSTEM_DISK: public
      FILESYSTEM_DRIVER: public

      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr

      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1

      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: nachdit.customers@gmail.com
      MAIL_FROM_NAME: Sobitas
    networks:
      - sobitas-net
    expose:
      - "9000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Host bind-mount: uploaded files persist across container recreations.
      # php-fpm writes here; nginx reads the same host directory via its own mount.
      - /var/sobitas/uploads:/var/www/html/storage/app/public

  backend-v2-queue:
    image: ghcr.io/declared-as-ala/sobitas-backend-v2:latest
    container_name: sobitas-backend-v2-queue
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-protein_db}
      DB_USERNAME: ${MYSQL_USER:-laravel}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}

      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://admin.protein.tn
      FILESYSTEM_DISK: public
      FILESYSTEM_DRIVER: public

      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      LOG_CHANNEL: stderr

      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1

      MAIL_MAILER: smtp
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: nachdit.customers@gmail.com
      MAIL_FROM_NAME: Sobitas
    command: >
      php artisan queue:work redis
      --sleep=3
      --tries=3
      --max-time=3600
    networks:
      - sobitas-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /var/sobitas/uploads:/var/www/html/storage/app/public

  backend-v2-public-init:
    image: ghcr.io/declared-as-ala/sobitas-backend-v2:latest
    container_name: sobitas-backend-v2-public-init
    restart: "no"
    networks:
      - sobitas-net
    volumes:
      - backend-v2-public:/public
      - /var/sobitas/uploads:/var/www/html/storage/app/public
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "=== Syncing public assets to nginx volume (non-destructive) ==="
        cp -a /var/www/html/public/. /public/
        ln -sfn /var/www/html/storage/app/public /public/storage
        echo "✓ Public assets synced"
        echo "✓ Storage symlink: /public/storage -> /var/www/html/storage/app/public"
        ls -la /public/storage 2>/dev/null || echo "⚠ Warning: storage symlink not visible"

  backend-nginx-v2:
    image: nginx:stable
    container_name: sobitas-laravel-nginx-v2
    restart: unless-stopped
    ports:
      - "8083:80"
    networks:
      - sobitas-net
    depends_on:
      - backend-v2
    volumes:
      - backend-v2-public:/var/www/html/public:ro
      - /var/sobitas/uploads:/var/www/html/storage/app/public:ro
      - ./nginx/configuration.conf:/etc/nginx/conf.d/default.conf:ro

  fitness-api:
    image: ghcr.io/declared-as-ala/sobitas-fitness-api:latest
    build:
      context: ./fitness-api
      dockerfile: Dockerfile
    container_name: sobitas-fitness-api
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: mysql://laravel:secret@mysql:3306/protein_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      NODE_ENV: production
    ports:
      - "4000:4000"
    networks:
      - sobitas-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ghcr.io/declared-as-ala/sobitas-frontend:latest
    container_name: sobitas-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # NEXT_PUBLIC_* are baked into the client bundle at build time by CI.
      # Setting them here only affects server-side process.env reads (Server Components).
      # Both must match the CI build-args in deploy-frontend.yml to prevent
      # React hydration mismatches (SSR URL ≠ client URL → images flash/disappear).
      NEXT_PUBLIC_API_URL: https://protein.tn/api-proxy
      NEXT_PUBLIC_STORAGE_URL: https://admin.protein.tn/storage
      # Server-side rewrite targets: use internal Docker DNS (avoids the public internet).
      API_BACKEND_URL: http://backend-nginx-v2/api
      STORAGE_BACKEND_URL: http://backend-nginx-v2/storage
    ports:
      - "3001:3000"
    networks:
      - sobitas-net

volumes:
  mysql-data:
  redis-data:
  backend-v2-public:

networks:
  sobitas-net:
    driver: bridge
  sobitas-full-net:
    external: true
    name: sobitas-full-project_sobitas-net